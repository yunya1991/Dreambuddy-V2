name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.12"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff lint
        run: ruff check . --output-format=github

      - name: Run black format check
        run: black --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          pip install pandas numpy scipy requests python-dotenv flask flask-cors
          pip install jsonschema pytest-parallel  # dreambuddy-v2 MVP L1/L2 需求（schema校验+并行冒烟）

      - name: Run V15 martin tests
        run: |
          cd 14-V15经典马丁策略 && python -m pytest tests/ -v --tb=short
        continue-on-error: true

      - name: Run risk module tests
        run: |
          cd 13-通用风控模块 && python -m pytest tests/ -v --tb=short
        continue-on-error: true

      - name: Run screen trend tests
        run: |
          cd 12-三屏趋势系统 && python -m pytest tests/ -v --tb=short
        continue-on-error: true

      - name: Run yijing tests
        run: |
          cd 11-易经推理系统 && python -m pytest tests/ -v --tb=short -k "not stress"
        continue-on-error: true

      # === dreambuddy-v2 MVP: L1 Resistance Vector + 权重冒烟（18+10 = 28 条）===
      - name: Run MVP L1 Resistance + Weights unit tests
        run: |
          PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH \
          python -m pytest \
            '21-特征工程中心/tests/unit/test_resistance_features.py' \
            '21-特征工程中心/tests/unit/test_default_weights.py' \
            -v --tb=short
        continue-on-error: true

      # === dreambuddy-v2 MVP: L2 Strategy Gene schema + 库（12 条）===
      - name: Run MVP L2 Strategy Gene schema + library tests
        run: |
          PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH \
          python -m pytest '4-MEMORY/tests/test_strategy_genes.py' -v --tb=short
        continue-on-error: true

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pandas numpy scipy

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=14-V15经典马丁策略/core \
            --cov=14-V15经典马丁策略/lib \
            --cov=13-通用风控模块/core \
            --cov=13-通用风控模块/rules \
            --cov=12-三屏趋势系统/core \
            --cov=dreambuddy_core \
            --cov='21-特征工程中心/feature_hub/resistance_features.py' \
            --cov='4-MEMORY/2-交易记忆单元/strategy_gene_schema.py' \
            --cov-report=term-missing \
            --cov-report=xml \
            14-V15经典马丁策略/tests/ \
            13-通用风控模块/tests/ \
            12-三屏趋势系统/tests/ \
            '21-特征工程中心/tests/unit/' \
            '4-MEMORY/tests/' \
            -v
        continue-on-error: true

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
        if: always()

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== CI Quality Gate ==="
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo ""
          if [ "${{ needs.lint.result }}" = "failure" ]; then
            echo "❌ Lint failed - quality gate not passed"
            exit 1
          fi
          echo "✅ Quality gate passed"
