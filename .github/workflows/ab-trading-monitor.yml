name: "AB Trading Monitor — Snapshot & Pages"

on:
  schedule:
    # 每 5 分钟生成一次快照（UTC 时间）
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/ab-trading/monitor.html'
      - 'experiments/ab-trading/export_state.py'
      - '.github/workflows/ab-trading-monitor.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  snapshot-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate state snapshot
        run: |
          cd experiments/ab-trading
          python3 export_state.py

      - name: Commit and push snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add experiments/ab-trading/state.json
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "chore(monitor): auto-update state snapshot" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'experiments/ab-trading'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
