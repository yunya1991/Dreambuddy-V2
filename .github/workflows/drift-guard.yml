name: drift-guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      change_class:
        required: true
        type: choice
        options: [mainline, integration, infra]
        default: mainline
  schedule:
    - cron: "10 */4 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

concurrency:
  group: drift-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Ensure clean workspace
        shell: bash
        run: |
          set -e
          git reset --hard
          git clean -fdx

      - name: Run drift guard
        id: drift
        uses: ./.github/actions/drift-guard
        with:
          mode: ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
          change_class: ${{ inputs.change_class || 'mainline' }}
          config_path: .workbuddy/drift-guard.json
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          report_json: drift_report.json
          report_md: drift_report.md

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-guard-report-${{ github.run_id }}
          path: |
            drift_report.json
            drift_report.md

      - name: Comment drift report (PR block)
        if: ${{ failure() && github.event_name == 'pull_request' && hashFiles('drift_report.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("drift_report.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
