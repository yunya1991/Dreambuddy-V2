    notes: "R10 实测失败(2026-11-12,DSH 0.1.5-rc.3)：模块加载正常，但它把 systemPrompt.section 的 text 写成 async 函数，而 DSH SystemPrompt.assemble 不 await（dsh-system-prompt/lib/index.js:339），启用即崩溃 `dsh: UNKNOWN: text.indexOf is not a function`。对照组(enableSkill:false)可正常跑到 LLM 请求，证明是 section text 而非加载问题。当前在 sandbox/cordis.patch.yml 中 disabled:true；上游修复前不得提升到 headless/web。另：该插件不注册任何 tool，只注入 prompt，验收标准应为 prompt 注入而非工具调用 → 无 MCP 壳可映射（仅 prompt patch，非工具消费）"

