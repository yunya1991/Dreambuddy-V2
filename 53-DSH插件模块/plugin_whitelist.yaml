# 53-DSH插件模块/plugin_whitelist.yaml
# DSH 插件白名单（P1-2 落地 + P3 消费侧强制经壳）— 唯一治理事实源
#
# 定位：任何要挂进 dsh profile 的非核心插件（非 @deepseek-ai/* 官方包）都必须在此登记。
# 校验：python3 53-DSH插件模块/check_whitelist.py --profile <name>
#
# 规则（deny-by-default）：
#   1. 未登记 = 拒绝加载（default_deny: true）
#   2. 社区插件必须先在 sandbox profile 实测（sandbox_verified: true）才能进生产 profile
#   3. risk_level=forbidden 任何 profile 都不许加载
#   4. FAIL-OPEN 未验证的插件不得进生产 profile（fail_open_verified: true）
#   5. 自有插件（status=approved）必须标记 mcp_shell_required: true——消费侧不得直连
#      插件 tool，必须经对应 MCP 壳的 control port 路由（DEC-06 壳化硬约束）
version: "v1"
last_updated: "2026-11-13"
default_deny: true

policies:
  production_profiles: ["web", "headless", "superagent"]
  sandbox_profiles: ["sandbox"]
  require_sandbox_first: true      # 社区插件先进 sandbox
  require_fail_open: true          # 进生产必须验证 FAIL-OPEN
  max_risk_for_production: "medium"
  require_mcp_shell_for_approved: true  # P3: 自有 approved 插件消费侧强制经 MCP 壳

