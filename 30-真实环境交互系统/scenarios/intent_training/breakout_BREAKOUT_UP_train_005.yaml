name: P1-BREAKOUT-BREAKOUT_UP-train-005
description: breakout 意图 × BREAKOUT_UP 场景 (train)
timeout: 60
retry: 0
intent_training:
  gold_intent: breakout
  scenario_id: BREAKOUT_UP
  split: train
  market_features:
    regime: breakout
    volatility: high
    data_freshness: realtime
steps:
- name: 打开聊天页面
  action: navigate
  url: http://localhost:3001/chat
- name: 输入问法
  action: type
  selector: textarea, input[type='text'], [contenteditable]
  text: XRP 突破前高了，能追突破吗
  human: true
- name: 提交查询
  action: click
  selector: button[type='submit'], button:has-text('发送')
  human: true
- name: 等待响应
  action: wait
  seconds: 3
