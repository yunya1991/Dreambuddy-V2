name: P1-BREAKOUT-BREAKOUT_UP-eval-002
description: breakout 意图 × BREAKOUT_UP 场景 (eval)
timeout: 60
retry: 0
intent_training:
  gold_intent: breakout
  scenario_id: BREAKOUT_UP
  split: eval
  market_features:
    regime: breakout
    volatility: high
    data_freshness: realtime
steps:
- name: 打开聊天页面
  action: navigate
  url: http://localhost:3001/chat
- name: 输入问法
  action: type
  selector: textarea, input[type='text'], [contenteditable]
  text: ETH 突破了吗，能追吗
  human: true
- name: 提交查询
  action: click
  selector: button[type='submit'], button:has-text('发送')
  human: true
- name: 等待响应
  action: wait
  seconds: 3
