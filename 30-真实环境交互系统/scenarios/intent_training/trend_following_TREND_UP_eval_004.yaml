name: P1-TREND_FOLLOWING-TREND_UP-eval-004
description: trend_following 意图 × TREND_UP 场景 (eval)
timeout: 60
retry: 0
intent_training:
  gold_intent: trend_following
  scenario_id: TREND_UP
  split: eval
  market_features:
    regime: trending
    volatility: medium
    data_freshness: realtime
steps:
- name: 打开聊天页面
  action: navigate
  url: http://localhost:3001/chat
- name: 输入问法
  action: type
  selector: textarea, input[type='text'], [contenteditable]
  text: BNB 趋势怎么看，向上吗
  human: true
- name: 提交查询
  action: click
  selector: button[type='submit'], button:has-text('发送')
  human: true
- name: 等待响应
  action: wait
  seconds: 3
