name: TRADE-BREAKOUT-BREAKOUT_UP-eval-007
description: breakout 意图 × BREAKOUT_UP 场景 (eval) @ /dashboard/trade
timeout: 60
retry: 0
intent_training:
  gold_intent: breakout
  scenario_id: BREAKOUT_UP
  split: eval
  market_features:
    regime: breakout
    volatility: high
    data_freshness: realtime
steps:
- name: 打开 Trade 页
  action: navigate
  url: http://localhost:3001/dashboard/trade
- name: 等待页面加载
  action: wait
  seconds: 2
- name: 输入问法
  action: type
  selector: textarea, input[type='text'], [contenteditable]
  text: ETH 突破策略怎么做
  human: true
- name: 提交查询
  action: click
  selector: button[type='submit'], button:has-text('发送')
  human: true
- name: 等待响应
  action: wait
  seconds: 10
