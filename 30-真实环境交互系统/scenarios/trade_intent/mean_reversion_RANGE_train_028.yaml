name: TRADE-MEAN_REVERSION-RANGE-train-028
description: mean_reversion 意图 × RANGE 场景 (train) @ /dashboard/trade
timeout: 60
retry: 0
intent_training:
  gold_intent: mean_reversion
  scenario_id: RANGE
  split: train
  market_features:
    regime: ranging
    volatility: low
    data_freshness: realtime
steps:
- name: 打开 Trade 页
  action: navigate
  url: http://localhost:3001/dashboard/trade
- name: 等待页面加载
  action: wait
  seconds: 2
- name: 输入问法
  action: type
  selector: textarea, input[type='text'], [contenteditable]
  text: 震荡行情 SOL，高抛低吸点位
  human: true
- name: 提交查询
  action: click
  selector: button[type='submit'], button:has-text('发送')
  human: true
- name: 等待响应
  action: wait
  seconds: 10
