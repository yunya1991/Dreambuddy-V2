[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dreambuddy-v2"
version = "2.0.0"
description = "DreamBuddy V2 - AI-driven crypto trading decision system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "DreamBuddy Team" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.0",
    "ruff>=0.6.0",
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.0",
    "bandit>=1.7",
]
trading = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "flask>=3.0",
    "flask-cors>=4.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | venv
    | __pycache__
    | .pytest_cache
    | .ruff_cache
    | user_data
    | data
    | artifacts
    | models
    | .github
  )/
  | migrations/
)
'''

[tool.ruff]
target-version = "py310"
line-length = 100
output-format = "concise"
extend-exclude = [
    ".venv",
    "venv",
    "node_modules",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".git",
    "user_data",
    "data",
    "artifacts",
    "models",
    "dist",
    "build",
    ".tox",
    "migrations",
    "10-经典指标系统/user_data/strategies/github",
    "9-基本面分析/币安Skill",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # Do not perform function call in argument defaults
    "C901",  # too complex (handled by radon)
]

[tool.ruff.lint.isort]
known-first-party = ["dreamos"]
known-third-party = ["pandas", "numpy", "flask", "requests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
    "14-V15经典马丁策略/tests",
    "13-通用风控模块/tests",
    "12-三屏趋势系统/tests",
    "11-易经推理系统/tests",
    "10-经典指标系统",
    "1-ARCHITECTURE/dreamos/dreamos-tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "stress: marks tests as stress tests",
]

[tool.coverage.run]
source = [
    "14-V15经典马丁策略/core",
    "14-V15经典马丁策略/lib",
    "13-通用风控模块/core",
    "13-通用风控模块/rules",
    "12-三屏趋势系统/core",
    "11-易经推理系统/scripts/memory_l4",
    "1-ARCHITECTURE/dreamos",
]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/setup.py",
    "*/conftest.py",
    "*/migrations/*",
    "*/user_data/*",
    "*/models/*",
]
branch = true
command_line = "-m"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "import .*_pb2",
    "TYPE_CHECKING",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
show_column_numbers = true
show_error_end = true
color_output = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "*.tests.*",
]
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = [
    "tests",
    "test_*.py",
    ".venv",
    "venv",
    "node_modules",
    "user_data",
    "data",
    "artifacts",
    "migrations",
]
tests = []
skips = ["B101", "B303", "B404", "B602", "B603", "B605", "B606"]
