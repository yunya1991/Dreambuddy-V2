# 爬虫轨目标站点配置 — 对齐 TECHNICAL_DESIGN.md §9.1
# enabled=false 的站点不会被 runner 调用。
# selectors 为 CSS 选择器，generic_spider / ScraplingEngine 按选择器提取字段。
#
# engine 字段（新增，可选，默认 static）：
#   static   — 原 requests + Scrapy Selector（向后兼容）
#   http     — Scrapling Fetcher（curl_cffi TLS 指纹模拟，适合静态站）
#   dynamic  — Scrapling DynamicFetcher（Playwright JS 渲染）
#   stealthy — Scrapling StealthyFetcher（Patchright + Cloudflare 绕过）
#
# adaptive 字段（新增，可选，默认 false）：
#   true — 启用 Scrapling 自适应解析，页面结构变更后自动重新定位元素
#
# FAIL-OPEN：Scrapling 任何异常自动回退到 static 链路，不阻塞采集。

sites:
  # --- 央行/政策官网 ---
  pbc_announcement:
    enabled: true
    source: pbc
    sub_category: announcement
    url: "http://www.pbc.gov.cn/goutongjiaoliu/113456/113469/index.html"
    js_render: false
    engine: http              # 🆕 Scrapling Fetcher（TLS 指纹）
    adaptive: true            # 🆕 自适应解析
    selectors:
      item: ".newslist_style a"   # 修正：pbc 实际 class 为 newslist_style
      title: "text"
      link: "href"
      date: ""

  fed_minutes:
    enabled: true              # 🆕 激活（原 disabled）
    source: fed
    sub_category: minutes
    url: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
    js_render: false
    engine: http               # 🆕 Scrapling Fetcher
    adaptive: true             # 🆕 自适应解析
    selectors:
      item: ".col-md-8 a, .fomc-meeting a"
      title: "::text"
      link: "::attr(href)"

  # --- 加密新闻站 ---
  coindesk_rss:
    enabled: true
    source: coindesk
    sub_category: news
    url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    js_render: false
    engine: static             # RSS/XML 用 static（Scrapy Selector XML 模式）
    adaptive: false
    selectors:
      item: "item"
      title: "title::text"
      link: "link::text"
      date: "pubDate::text"

  # --- Cloudflare 保护站点 ---
  binance_announcement:
    enabled: true              # 🆕 激活（原 disabled，因反爬）
    source: binance
    sub_category: announcement
    url: "https://www.binance.com/en/support/announcement/new-cryptocurrency-listing"
    js_render: true
    engine: stealthy           # 🆕 StealthyFetcher 绕过 Cloudflare
    adaptive: true             # 🆕 自适应解析
    selectors:
      item: "[class*='announcement-item']"
      title: "text"
      link: "href"

  # ============================================================
  # 律动 PAData (data.panewslab.com) — 多板块数据补充
  # SDK 轨 panewslab collector 已覆盖 8 大板块的结构化 JSON API。
  # 爬虫轨聚焦抓取 SDK 不暴露的 DOM 展示数据。
  # ============================================================
  panewslab_holdings_cards:
    enabled: true              # 🆕 激活（原 disabled）
    source: panewslab
    sub_category: holdings_cards
    url: "https://data.panewslab.com/#holdings"
    js_render: true
    engine: dynamic            # 🆕 Scrapling DynamicFetcher
    adaptive: true             # 🆕 自适应解析
    selectors:
      item: "section#holdings [data-entity-slug]"
      slug: "[data-entity-slug]::attr(data-entity-slug)"
      title: "[data-role='entity-name']::text"
      total_usd: "[data-role='entity-total']::text"
      flow24h: "[data-role='entity-flow24h']::text"
      flow7d: "[data-role='entity-flow7d']::text"
      entity_url: "a[href]::attr(href)"

  panewslab_overview_cards:
    enabled: true              # 🆕 激活（原 disabled）
    source: panewslab
    sub_category: overview_cards
    url: "https://data.panewslab.com/#overview"
    js_render: true
    engine: dynamic            # 🆕 Scrapling DynamicFetcher
    adaptive: true             # 🆕 自适应解析
    selectors:
      item: "section#overview article.snapshot-card"
      label: "header > span::text"
      change30d: "header > em::text"
      value: "strong[data-live]::text"
      role: "strong::attr(data-live)"
      footer_label: "footer > span::text"
      footer_window: "footer > b::text"

  # ============================================================
  # 律动 TheBlockBeats Dataview 直抓（爬虫轨备用）
  # ============================================================
  theblockbeats_dataview_cards:
    enabled: true              # 🆕 激活（原 disabled）
    source: theblockbeats_dataview
    sub_category: echarts_cards
    url: "https://www.theblockbeats.info/dataview"
    js_render: true
    engine: stealthy           # 🆕 StealthyFetcher（绕过可能的反爬）
    adaptive: true             # 🆕 自适应解析
    selectors:
      item: ".kline-chart-wrap-head"
      metric_title: ".kline-chart-wrap-head-left::text"
      time_range: ".home-inflow-top-rgt::text"

  # ============================================================
  # OKX 公告（SDK 轨 okx_announcement collector 同步注册）
  # ============================================================
  okx_announcement:
    enabled: true
    source: okx_announcement
    sub_category: announcement
    url: "https://www.okx.com/support/hc/zh-cn/sections/360000030652"
    js_render: true
    engine: stealthy           # 🆕 StealthyFetcher 绕过 OKX 反爬
    adaptive: true
    selectors:
      item: "li.article-list-item a"
      title: "::text"
      link: "::attr(href)"

  # ============================================================
  # Cointelegraph 中文（SDK 轨 cointelegraph_cn collector 同步注册）
  # ============================================================
  cointelegraph_cn:
    enabled: true
    source: cointelegraph_cn
    sub_category: news
    url: "https://cn.cointelegraph.com/"
    js_render: true
    engine: stealthy           # 🆕 StealthyFetcher
    adaptive: true             # 🆕 自适应解析（页面改版后自动重定位）
    selectors:
      item: "article, .post-card, [class*='post-card']"
      title: "h2 span::text, h3 span::text, .post-card__title span::text"
      link: "a::attr(href)"
      summary: "p::text, .post-card__summary::text"
