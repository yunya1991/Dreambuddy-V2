  rule_follow_up: [S.intent]
  rule_prefilter: [S.intent]
  fallback_rule: [S.intent]
  fallback_default: [S.intent]
  non_financial_skip: [S.intent]
  clarification_requested: [S.intent]
  low_confidence_clarification: [S.intent]
  clarification_sent: [S.intent]
  chain_started: [S.plan, A.selector]
  routed: [A.router]
  task_created: [C.dsh]
  inline_exec_start: [C.dsh]
  inline_exec_done: [C.dsh]
  async_spawned: [C.dsh]
  wb_received: [C.dsh]
  wb_processing: [C.dsh]
  wb_completed: [C.dsh]
