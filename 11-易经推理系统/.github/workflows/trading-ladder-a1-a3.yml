name: Trading Ladder A1-A3
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  trading-ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run A1-A3 Trading Ladder
        run: python3 -m scripts.memory_l4.ab_bridge run-all
