# yijing-polling-trader 运行时覆盖（部署到 /etc/systemd/system/yijing-polling-trader.service.d/20-runtime.conf）
#
# 1) 代理：systemd 不继承登录 shell 的代理变量，这里从可选环境文件读取。
#    云端创建 /etc/dreambuddy/okx-proxy.env，内容示例：
#      HTTP_PROXY=http://127.0.0.1:7890
#      HTTPS_PROXY=http://127.0.0.1:7890
#      NO_PROXY=127.0.0.1,localhost
#    文件不存在时 systemd 不报错（前缀 "-"），进程按直连处理。
# 2) 停机：代码已加协作式退出检查点，这里把上限放宽到 150s 作为兜底，
#    避免一轮重推理/网络请求未及时收尾时被 SIGKILL。
[Service]
EnvironmentFile=-/etc/dreambuddy/okx-proxy.env
TimeoutStopSec=150
