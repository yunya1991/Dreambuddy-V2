# ============================================================
# Dreambuddy V2 — 日志轮转配置
# 安装: sudo cp logrotate-dreambuddy.conf /etc/logrotate.d/dreambuddy
# 测试: sudo logrotate -d /etc/logrotate.d/dreambuddy  (dry-run)
# 强制: sudo logrotate -f /etc/logrotate.d/dreambuddy
# ============================================================

# ── V15 策略日志 ──
/home/luke/logs/v15/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    copytruncate
    su luke luke
}

# ── V15 目录内日志 ──
/home/luke/dreambuddy/14-V15经典马丁策略/logs/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    copytruncate
    su luke luke
}

# ── Hermes 网关日志 ──
/home/luke/.hermes/logs/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    copytruncate
    su luke luke
