# 15-监控告警系统 v2.0 配置（云端）
# 说明：本文件是监控判定参数的单一事实源；带宽/端口/凭证不写死在这里。
version: 1

host:
  name: VM-0-5-ubuntu
  timezone: Asia/Shanghai

receiver:
  listen: "127.0.0.1:9098"
  # 飞书 app_id / app_secret / chat_id 从 env 文件读取，禁止入库
  env_file: /etc/dreambuddy-monitoring/monitoring.env
  routes:
    P0: risk        # Trading-RiskControl
    P1: desk        # Trading-Desk
    P2: desk
    P3: management  # Trading-Management

exporter:
  listen: "127.0.0.1:9101"
  scan_interval_seconds: 60
  repo_root: /home/luke/dreambuddy

# 产物新鲜度：超过 ttl_seconds 判 stale
artifacts:
  - name: cycle_state
    path: 40-周期神经网络系统/cycle_state.json
    timestamp_field: generated_at
    ttl_seconds: 93600        # 26h
    severity: P1
  - name: strategy_mapping
    path: 40-周期神经网络系统/strategy_mapping.json
    timestamp_field: generated_at
    ttl_seconds: 93600
    severity: P1
  - name: fund_flow
    path: 40-周期神经网络系统/fund_flow.json
    timestamp_field: generated_at
    ttl_seconds: 93600
    severity: P2
  - name: sector_transmission
    path: 40-周期神经网络系统/sector_transmission.json
    timestamp_field: generated_at
    ttl_seconds: 93600
    severity: P2
  - name: strategic_extension_signal
    path: 43-战略承接推演层/runtime/strategic_extension_signal.json
    timestamp_field: generated_at
    ttl_seconds: 5400         # 90min
    severity: P1
  - name: bus_state
    path: 42-神经网络交易协调层/runtime/bus_state.json
    timestamp_field: generated_at
    ttl_seconds: 2700         # 45min
    severity: P1
  - name: shadow_gate_state
    path: 43-战略承接推演层/runtime/shadow_gate_state.json
    timestamp_field: null      # 无时间戳，按 mtime
    ttl_seconds: 604800        # 7d 未推进即 P2
    severity: P2
  - name: nn_feedback
    path: 48-涌现架构/events/nn_feedback/40_feedback.json
    timestamp_field: generated_at
    ttl_seconds: 93600
    severity: P2
  - name: emergence_metrics
    path: 48-涌现架构/metrics/emergence_metrics.jsonl
    timestamp_field: null
    ttl_seconds: 93600
    severity: P2
  # entry23 活体心跳：entry_runner 每 300s 每币写一次（kline_event_handler → event_receiver）
  - name: entry23_heartbeat
    path: 23-四层闭环自进化交易架构/runtime/event_driven_state.json
    timestamp_field: null
    ttl_seconds: 900         # 3 轮（900s）无心跳即 P1，替代原先用决策审计判存活
    severity: P1
  # 决策流心跳：每次 K 线收盘都会产出 pipeline.decision（WAIT 也写），
  # 直接从 chain_events 取最近一条决策时间，真正的"决策沉默"判定
  - name: decision_flow_23
    path: 23-四层闭环自进化交易架构/runtime/chain_events-*.jsonl
    chain_event_node: pipeline.decision
    ttl_seconds: 1800        # 实测最大自然间隔 804s（近 2 日），30min 留 2 倍余量
    severity: P1
  # 决策审计仅在真实 submit 时追加（WAIT 不写、去重拦截不写），已不承担存活/沉默信号；
  # 48h 仅作"长期零下单"粗粒度兜底
  - name: execution_decisions_23
    path: 23-四层闭环自进化交易架构/runtime/execution_decisions.jsonl
    timestamp_field: null
    ttl_seconds: 172800      # 48h
    severity: P2
  # ---- 主神经网络链（TD §14，source=main-nn）----
  - name: decisions_50
    path: 50-NN主矛盾评估器/runtime/decisions.jsonl
    timestamp_field: null
    ttl_seconds: 86400       # 50 为批处理，24h 无决策即 P2
    severity: P2
  - name: outbox_50
    path: 50-NN主矛盾评估器/runtime/live/outbox.jsonl
    timestamp_field: null
    ttl_seconds: 900         # 与 link 周期一致（15min）
    severity: P1
  - name: nn_feedback_consumption_40
    path: 40-周期神经网络系统/nn_feedback_consumption.json
    timestamp_field: null
    ttl_seconds: 93600       # 26h
    severity: P2

# 任务调度新鲜度：由 push_job.sh 推送 dreambuddy_job_last_success_timestamp_seconds
jobs:
  - name: 40_daily
    expected_interval_seconds: 86400
    ttl_seconds: 93600
    severity: P1
  - name: 40_x0
    expected_interval_seconds: 86400
    ttl_seconds: 93600
    severity: P2
  - name: 40_x1
    expected_interval_seconds: 86400
    ttl_seconds: 93600
    severity: P2
  - name: bus_42
    expected_interval_seconds: 900
    ttl_seconds: 2700
    severity: P1
  - name: publish_43
    expected_interval_seconds: 1800
    ttl_seconds: 5400
    severity: P1
  - name: shadow_50
    expected_interval_seconds: 900
    ttl_seconds: 3600
    severity: P1
  - name: live_50
    expected_interval_seconds: 300
    ttl_seconds: 900
    severity: P0
  - name: metrics_48
    expected_interval_seconds: 86400
    ttl_seconds: 93600
    severity: P2

# 链路阈值
link:
  bus_min_active_sources: 6
  bus_critical_sources:
    - 40-cycle
    - 43-strategic
    - 11-bcrm-tactical
  degraded_events_per_minute_warn: 5
  decision_silence_hours: 24

# 资金/交易监控
risk:
  domains:
    50-nn:
      notional_cap_usdt:
        default: 100
        us_index: 300
        apac_index: 150
        us_etf: 150
    23-evolution:
      # 待确认：1600 USDT 是否为该域预期；确认前按 P1 观察，不直接阻断
      notional_cap_usdt:
        default: 1600
  daily_drawdown_pct:
    50-nn: 1.0
    23-evolution: 3.0
  reconcile_break_tolerance: 0
  reconcile_break_minutes: 15
  symbol_whitelist_source: 22-执行引擎中心/config/live_symbols.json
  forbidden_symbols:
    - BTC-FLAP-PAYLOAD

# 23 推理信号（一期核心）
signals:
  source: 23-evolution
  contract: 49-交易框架协议/contracts/final_decision_signal.v1.2.json
  required_top_level:
    [signal_id, source, ts, symbol, direction, confidence, horizon,
     risk_exposure_hint, expires_at, mode, payload]
  required_payload_23:
    [action, position_tier, position_mult, d_star, ri, l4_v, regime,
     primary_contradiction, contradiction_shift, elastic_result,
     cross_validation, path]
  decision_audit: 23-四层闭环自进化交易架构/runtime/execution_decisions.jsonl
  outbox_db: 23-四层闭环自进化交易架构/runtime/execution_outbox.db
  expected_interval_seconds: 300
  silence_alert_seconds: 1800
  ttl_seconds: 900
  # 2026-11-17 已切换实盘（entry23 去掉 --dry-run，EVOLUTION_ENTRY23_ENABLED=on）。
  # 前 2 周（至 2026-12-01）只告警、不自动阻断；到期后按 §12.6 复核再收敛。
  expected_mode: live
  enforcement: alert_only
  alert_only_until: "2026-12-01"
  live_since: "2026-11-17T12:18:37+08:00"
  max_signal_to_gateway_ms: 2000
  max_reject_rate: 0.05
  max_duplicate_rate: 0.01
  outbox_stuck_seconds: 300
  min_fill_join_ratio: 0.95
  # 语义状态（primary_contradiction / cross_validation）时效窗口：
  # 超过窗口的旧决策不再参与"当前态"指标，避免 cv_degraded_mode 等告警永不恢复。
  state_window_seconds: 43200
  # 主神经网络链（TD §14，M0–M14）。strategic_total 告警三条件之一：
  # bridge 开关 + 40 产物新鲜 + shadow 未解除，缺一不告警。
  main_nn:
    source: main-nn
    evidence_min_sources: 6
    decision_silence_minutes: 1440
    strategic_total_flat_minutes: 120
    cycle_stale_seconds: 93600
    state_window_seconds: 86400
    outbox_stale_seconds: 900

# 11 交易循环退役后的执行链监控（2026-11-18，见 TD §13.8）
execution:
  entry23_unit: dreambuddy-entry23
  exit23_unit: dreambuddy-exit23
  ledger_db: 22-执行引擎中心/runtime/position_ledger.db
  sltp_audit: 22-执行引擎中心/audit/sltp_reconcile.jsonl
  reconcile_drift_alert_per_hour: 3
  sltp_stale_seconds: 600
  # 主神经网络链（TD §14，M12–M14）：live 出箱与 22 执行/归因
  main_nn:
    decisions: 50-NN主矛盾评估器/runtime/decisions.jsonl
    outbox: 50-NN主矛盾评估器/runtime/live/outbox.jsonl
    x1_state: 22-执行引擎中心/runtime/x1_live_processed.json
    fills: 22-执行引擎中心/audit/x1_live_fills.jsonl
    live_stale_minutes: 15
    sltp_coverage_min: 1.0

# 11 已下线，universe_snapshot 无写入方（23 未接管）；
# 保持关闭以避免 EvolutionScanStalled/Failed/PoolShrunk 永久误报。23 接管后改 true。
universe:
  enabled: false
  path: 23-四层闭环自进化交易架构/runtime/universe_snapshot.json

# 告警治理
alerting:
  dedup_cooldown_seconds: 1800
  repeat_interval: 6h
  resolve_notification: true
  p0_silence_allowed: false
  require_runbook: true
