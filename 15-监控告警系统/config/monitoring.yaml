# 15-监控告警系统 v2.0 配置（云端）
# 说明：本文件是监控判定参数的单一事实源；带宽/端口/凭证不写死在这里。
version: 1

host:
  name: VM-0-5-ubuntu
  timezone: Asia/Shanghai

receiver:
  listen: "127.0.0.1:9098"
  # 飞书 app_id / app_secret / chat_id 从 env 文件读取，禁止入库
  env_file: /etc/dreambuddy-monitoring/monitoring.env
  routes:
    P0: risk        # Trading-RiskControl
    P1: desk        # Trading-Desk
    P2: desk
    P3: management  # Trading-Management

exporter:
  listen: "127.0.0.1:9101"
  scan_interval_seconds: 60
  repo_root: /home/luke/dreambuddy

# 产物新鲜度：超过 ttl_seconds 判 stale
artifacts:
  - name: cycle_state
    path: 40-周期神经网络系统/cycle_state.json
    timestamp_field: generated_at
    ttl_seconds: 93600        # 26h
    severity: P1
  - name: strategy_mapping
    path: 40-周期神经网络系统/strategy_mapping.json
    timestamp_field: generated_at
    ttl_seconds: 93600
    severity: P1
  - name: fund_flow
    path: 40-周期神经网络系统/fund_flow.json
    timestamp_field: generated_at
    ttl_seconds: 93600
    severity: P2
  - name: sector_transmission
    path: 40-周期神经网络系统/sector_transmission.json
    timestamp_field: generated_at
    ttl_seconds: 93600
    severity: P2
  - name: strategic_extension_signal
    path: 43-战略承接推演层/runtime/strategic_extension_signal.json
    timestamp_field: generated_at
    ttl_seconds: 5400         # 90min
    severity: P1
  - name: bus_state
    path: 42-神经网络交易协调层/runtime/bus_state.json
    timestamp_field: generated_at
    ttl_seconds: 2700         # 45min
    severity: P1
  - name: shadow_gate_state
    path: 43-战略承接推演层/runtime/shadow_gate_state.json
    timestamp_field: null      # 无时间戳，按 mtime
    ttl_seconds: 604800        # 7d 未推进即 P2
    severity: P2
  - name: nn_feedback
    path: 48-涌现架构/events/nn_feedback/40_feedback.json
    timestamp_field: generated_at
    ttl_seconds: 93600
    severity: P2
  - name: emergence_metrics
    path: 48-涌现架构/metrics/emergence_metrics.jsonl
    timestamp_field: null
    ttl_seconds: 93600
    severity: P2
  - name: execution_decisions_23
    path: 23-四层闭环自进化交易架构/runtime/execution_decisions.jsonl
    timestamp_field: null
    ttl_seconds: 1800        # 一期：entry23 每 300s，30min 无写入即 P1
    severity: P1

# 任务调度新鲜度：由 push_job.sh 推送 dreambuddy_job_last_success_timestamp_seconds
jobs:
  - name: 40_daily
    expected_interval_seconds: 86400
    ttl_seconds: 93600
    severity: P1
  - name: 40_x0
    expected_interval_seconds: 86400
    ttl_seconds: 93600
    severity: P2
  - name: 40_x1
    expected_interval_seconds: 86400
    ttl_seconds: 93600
    severity: P2
  - name: bus_42
    expected_interval_seconds: 900
    ttl_seconds: 2700
    severity: P1
  - name: publish_43
    expected_interval_seconds: 1800
    ttl_seconds: 5400
    severity: P1
  - name: shadow_50
    expected_interval_seconds: 900
    ttl_seconds: 3600
    severity: P1
  - name: live_50
    expected_interval_seconds: 300
    ttl_seconds: 900
    severity: P0
  - name: metrics_48
    expected_interval_seconds: 86400
    ttl_seconds: 93600
    severity: P2

# 链路阈值
link:
  bus_min_active_sources: 6
  bus_critical_sources:
    - 40-cycle
    - 43-strategic
    - 11-bcrm-tactical
  degraded_events_per_minute_warn: 5
  decision_silence_hours: 24

# 资金/交易监控
risk:
  domains:
    50-nn:
      notional_cap_usdt:
        default: 100
        us_index: 300
        apac_index: 150
        us_etf: 150
    23-evolution:
      # 待确认：1600 USDT 是否为该域预期；确认前按 P1 观察，不直接阻断
      notional_cap_usdt:
        default: 1600
  daily_drawdown_pct:
    50-nn: 1.0
    23-evolution: 3.0
  reconcile_break_tolerance: 0
  reconcile_break_minutes: 15
  symbol_whitelist_source: 22-执行引擎中心/config/live_symbols.json
  forbidden_symbols:
    - BTC-FLAP-PAYLOAD

# 23 推理信号（一期核心）
signals:
  source: 23-evolution
  contract: 49-交易框架协议/contracts/final_decision_signal.v1.1.json
  required_top_level:
    [signal_id, source, ts, symbol, direction, confidence, horizon,
     risk_exposure_hint, expires_at, mode, payload]
  required_payload_23:
    [action, position_tier, position_mult, d_star, ri, l4_v, regime,
     primary_contradiction, contradiction_shift, elastic_result,
     cross_validation, path]
  decision_audit: 23-四层闭环自进化交易架构/runtime/execution_decisions.jsonl
  outbox_db: 23-四层闭环自进化交易架构/runtime/execution_outbox.db
  expected_interval_seconds: 300
  silence_alert_seconds: 1800
  ttl_seconds: 900
  # 2026-11-17 已切换实盘（entry23 去掉 --dry-run，EVOLUTION_ENTRY23_ENABLED=on）。
  # 前 2 周（至 2026-12-01）只告警、不自动阻断；到期后按 §12.6 复核再收敛。
  expected_mode: live
  enforcement: alert_only
  alert_only_until: "2026-12-01"
  live_since: "2026-11-17T12:18:37+08:00"
  max_signal_to_gateway_ms: 2000
  max_reject_rate: 0.05
  max_duplicate_rate: 0.01
  outbox_stuck_seconds: 300
  min_fill_join_ratio: 0.95

# 告警治理
alerting:
  dedup_cooldown_seconds: 1800
  repeat_interval: 6h
  resolve_notification: true
  p0_silence_allowed: false
  require_runbook: true
