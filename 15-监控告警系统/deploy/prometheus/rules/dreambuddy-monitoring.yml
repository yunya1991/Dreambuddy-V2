# DreamBuddy 全链路告警规则（v2.0 骨架）
# 约定：severity ∈ {P0,P1,P2,P3}；channel=alert；runbook 强绑定。
groups:
  - name: meta
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: P3
          channel: meta
        annotations:
          summary: "监控栈存活心跳（始终触发，用于外部死手开关）"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#106-告警分级与治理"

      - alert: MonitorSelfHeartbeatMissing
        expr: time() - max(dreambuddy_monitor_heartbeat_timestamp_seconds) > 600
        for: 1m
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "监控自身心跳缺失 >10min"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#106-告警分级与治理"

  - name: scheduling
    rules:
      - alert: NnLiveChainNoRun
        expr: time() - dreambuddy_job_last_run_timestamp_seconds{job="live_50"} > 900
        for: 1m
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "50 live + 22 执行链 15min 未运行"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#105-新鲜度-ttl-矩阵云端节奏"

      - alert: Daily40PipelineFailedOrLate
        expr: time() - dreambuddy_job_last_success_timestamp_seconds{job="40_daily"} > 93600
        for: 5m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "40 日更超过 26h 未成功"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#105-新鲜度-ttl-矩阵云端节奏"

      - alert: BusStale
        expr: time() - dreambuddy_job_last_success_timestamp_seconds{job="bus_42"} > 2700
        for: 1m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "42 总线超过 45min 未成功刷新"

      - alert: Publish43Stale
        expr: time() - dreambuddy_job_last_success_timestamp_seconds{job="publish_43"} > 5400
        for: 1m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "43 承接超过 90min 未成功发布"

      - alert: Shadow50Stale
        expr: time() - dreambuddy_job_last_success_timestamp_seconds{job="shadow_50"} > 3600
        for: 1m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "50 影子超过 60min 未成功运行"

      - alert: JobFailed
        expr: dreambuddy_job_status == 0
        for: 1m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "任务 {{ $labels.job }} 最近一次执行失败"

  - name: artifacts
    rules:
      - alert: ArtifactStale
        expr: dreambuddy_artifact_age_seconds > dreambuddy_artifact_ttl_seconds
        for: 5m
        labels:
          severity: "{{ $labels.severity }}"
          channel: alert
        annotations:
          summary: "产物 {{ $labels.artifact }} 已陈旧（age={{ $value }}s）"

      - alert: ArtifactMissing
        expr: dreambuddy_artifact_present == 0
        for: 5m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "产物 {{ $labels.artifact }} 不存在"

  - name: link
    rules:
      - alert: BusSourceMissing
        expr: dreambuddy_bus_active_sources < 6
        for: 10m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "42 总线活跃 source 少于 6（当前 {{ $value }}）"

      - alert: BusCriticalSourceMissing
        expr: dreambuddy_bus_source_present{source=~"40-cycle|43-strategic|11-bcrm-tactical"} == 0
        for: 10m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "42 关键 source {{ $labels.source }} 缺失"

      - alert: BusMetricsMismatch
        expr: dreambuddy_bus_metrics_mismatch > 0
        for: 5m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "42 metrics 与 bus_state 不一致"

      - alert: DecisionSilence
        expr: dreambuddy_decision_count_24h{domain="50-nn"} == 0
        for: 1h
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "50 有证据但 24h 无决策"

      - alert: DegradedEventFlood
        expr: rate(dreambuddy_degraded_events_total[5m]) * 60 > 5
        for: 10m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "42 降级事件 >5/min"

  - name: signals
    rules:
      - alert: SignalSchemaViolation
        expr: dreambuddy_signal_schema_valid_ratio{source="23-evolution"} < 0.99 and on() dreambuddy_signal_samples_recent{source="23-evolution"} > 0
        for: 30m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "23 信号 v1.1 契约一致率低于 99%"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#12-一期23-推理信号监控v22"

      - alert: SignalExpiredAtSubmit
        expr: increase(dreambuddy_signal_expired_total{source="23-evolution"}[10m]) > 0
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "已过期信号仍在提交"

      - alert: DryRunMismatch
        expr: dreambuddy_signal_mode_mismatch{source="23-evolution"} > 0
        for: 5m
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "期望实盘但 23 仍为 dry-run/关闭状态"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#125-实现一致性审计文档-vs-代码2026-11-17"

      - alert: OutboxStuck
        expr: dreambuddy_outbox_stuck > 0
        for: 5m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "发件箱存在超 5min 未推进的信号"

      - alert: GatewayRejectSpike
        expr: dreambuddy_signal_reject_ratio{source="23-evolution"} > 0.05
        for: 15m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "22 网关 15min 拒绝率 >5%"

      - alert: RiskGateEmpty
        expr: increase(dreambuddy_risk_rules_evaluated_zero_total[10m]) > 0
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "13 风控 0 条规则仍放行，疑似 fail-open"

      - alert: DuplicateDecisionSpike
        expr: dreambuddy_duplicate_decision_ratio{source="23-evolution"} > 0.01
        for: 15m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "重复 decision_id 比例 >1%"

      - alert: DecisionFillJoinLow
        expr: dreambuddy_decision_fill_join_ratio{domain="23-evolution"} < 0.95
        for: 1h
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "成交与 decision_id 关联率 <95%"

      - alert: ConfidenceDegenerate
        expr: dreambuddy_signal_confidence_stdev{source="23-evolution"} < 0.01 and on() (sum(dreambuddy_signal_generated_total{source="23-evolution"}) > 10)
        for: 2h
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "信号置信度方差趋零，模型可能退化"

      - alert: GatewayContractViolation
        expr: dreambuddy_contract_violations_1h > 0
        for: 10m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "22 网关契约校验发现违规（alert-only，未阻断订单）"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#12-一期23-推理信号监控v22"

      - alert: ContradictionMissing
        expr: dreambuddy_contradiction_present_ratio < 1 and dreambuddy_signal_samples_recent > 0
        for: 30m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "23 主矛盾字段缺失或为 unknown（信号已在交易但矛盾未透传）"

      - alert: CrossValidationMissing
        expr: dreambuddy_cv_present_ratio < 1 and dreambuddy_signal_samples_recent > 0
        for: 30m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "23 矛盾 Transformer 交叉验证缺失（payload.cross_validation 为空）"

      - alert: CrossValidationDegraded
        expr: count(dreambuddy_cv_degraded_mode{mode="both_none"}) > 0
        for: 15m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "23 交叉验证双链路均不可用（both_none）；attention_only/granger_only 属设计内单链路降级，SPRT 判定单链路不可信记为 no_reliable_link，均不告警"

      # 2026-11-18 下线：universe_snapshot 由 11 polling_trader 写入，11 交易循环已退役且 23 未接管，
      # 继续保留会导致 EvolutionScanStalled/Failed/PoolShrunk 永久误报（见 15 TD §13.8.2）。

      - alert: ChainBroken
        expr: dreambuddy_chain_missing_stage_total > 0
        for: 30m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "23 交易链路存在缺失节点（N10 有信号但 N12/N14 未到达）"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#134-链路汇总与复盘a-类的核心价值"

      - alert: ChainCompletionLow
        expr: dreambuddy_chain_completion_ratio < 0.95
        for: 1h
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "23 交易链路完整率 <95%（部分链路静默中断）"

      - alert: ChainWaitBroken
        expr: dreambuddy_chain_broken_total > 0
        for: 30m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "存在无法归因的 WAIT（非策略主动不交易），链路可能断在推理段"

      # ---- 信号口径校准（F1–F4，2026-11-18）----
      - alert: DstarCalibratedModeOff
        expr: dreambuddy_dstar_calibrated_enabled == 0
        for: 30m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "23 d_star 未运行校准口径（EVOLUTION_DSTAR_WAIT_MODE≠calibrated），检查 entry23 drop-in 环境变量"

      - alert: DstarCalibratedAllWait
        expr: dreambuddy_dstar_calibrated_trade_1h == 0 and dreambuddy_dstar_calibrated_wait_1h > 0
        for: 6h
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "23 校准口径连续 6h 全 WAIT（F4 回归：中性区 margin 或 R 量纲异常）"

      - alert: ReflexivityConstant
        expr: dreambuddy_r_reflexivity_distinct_24h == 1
        for: 6h
        labels:
          severity: P3
          channel: alert
        annotations:
          summary: "23 R_reflexivity 24h 内恒定，反身性 4:3:3 分项失效（查 N2 r_inputs 的 sentiment_score / bid_ask_spread_bps / corr_term）"

      - alert: EssDirectionEmpty
        expr: dreambuddy_ess_direction_empty_1h > 0
        for: 1h
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "23 ESS 方向为空（F1 回归：top 组合全为无方向离场组合），ripple_ri 将回退 0.5"

      - alert: RippleVolThresholdOutOfRange
        expr: dreambuddy_ripple_vol_threshold > 2.55 or dreambuddy_ripple_vol_threshold < 1.25
        for: 30m
        labels:
          severity: P3
          channel: alert
        annotations:
          summary: "23 自适应放量门槛越界（应在 1.30~2.50），检查 20 日波动率窗口或 K 线缺失"

      - alert: ReflectionSampleStarved
        expr: dreambuddy_reflection_ri_max <= 0.5 and dreambuddy_reflection_eligible_1h == 0
        for: 24h
        labels:
          severity: P3
          channel: alert
        annotations:
          summary: "23 reflection 24h 无有效样本（ri 恒 0.5）：检查 22 fills 平仓 realized_pnl 是否回写"

      - alert: ExitSizeUnknown
        expr: dreambuddy_exit_size_unknown_total > 0
        for: 10m
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "平仓数量无法确定，持仓风险未释放"

      - alert: ExitCloseFailed
        expr: dreambuddy_exit_close_failed_total > 0
        for: 10m
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "平仓/减仓执行失败，持仓风险持续暴露"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#132-23-交易链路信号环节全景n0n15"

  # 23 独立执行链 + 22 公共执行（2026-11-18，见 15 TD §13.8）
  - name: execution
    rules:
      - alert: Entry23Down
        expr: dreambuddy_entry23_active == 0
        for: 5m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "23 开仓进程非 active，开仓链已停"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#138-11-交易循环退役后的监控对齐v210-2026-11-18"

      - alert: Exit23Down
        expr: dreambuddy_exit23_active == 0
        for: 5m
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "23 平仓进程非 active，平仓与账本对账同时停摆（风险未释放）"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#138-11-交易循环退役后的监控对齐v210-2026-11-18"

      - alert: LedgerDriftFrequent
        expr: dreambuddy_ledger_reconcile_updated_1h > 3
        for: 30m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "22 账本 1h 内被对账校正 >3 次，数量/均价持续漂移"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#138-11-交易循环退役后的监控对齐v210-2026-11-18"

      # exchange_sltp（交易所侧 SL/TP 成交、已按真实成交价回填）属正常路径，
      # 仅导出 dreambuddy_ledger_exchange_sltp_24h 供 Grafana 观察，不告警；
      # 本规则只对「无成交可回填」的 ghost_exchange_flat 触发。
      - alert: GhostPositionCleaned
        expr: dreambuddy_ledger_ghost_exchange_flat_24h > 0
        for: 10m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "24h 内出现交易所已平仓但账本仍持仓且无真实成交可回填（ghost_exchange_flat），需人工核对"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#138-11-交易循环退役后的监控对齐v210-2026-11-18"

      - alert: GhostStaleBulkCleanup
        expr: dreambuddy_ledger_ghost_stale_24h > 20
        for: 30m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "24h 内 ghost_stale 清理超过 20 笔，疑似对账源批量漂移"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#138-11-交易循环退役后的监控对齐v210-2026-11-18"

      - alert: SltpReconcileFailed
        expr: dreambuddy_sltp_reconcile_failed_1h > 0
        for: 10m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "存量持仓 SL/TP 补挂失败，部分仓位缺少止损保护"

      - alert: SltpAlgoQueryFailed
        expr: dreambuddy_sltp_reconcile_query_failed_1h > 0
        for: 30m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "SL/TP 巡检的 algo 查询失败（多为 OKX 50011 限流），保护状态未知但不等于缺保护；查 22 audit 的 algo_query_fail 记录"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#138-11-交易循环退役后的监控对齐v210-2026-11-18"

      - alert: SltpReconcileStale
        expr: dreambuddy_exit23_active == 1 and dreambuddy_ledger_positions > 0 and dreambuddy_sltp_reconcile_age_seconds > 600
        for: 15m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "有持仓但 SL/TP 补挂巡检超过 10min 未运行"
          runbook_url: "15-监控告警系统/docs/TECHNICAL_DESIGN.md#138-11-交易循环退役后的监控对齐v210-2026-11-18"

  - name: trading
    rules:
      - alert: ReconcileBreak
        expr: dreambuddy_reconcile_breaks > 0
        for: 15m
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "持仓/成交对账不平，15min 未清零"

      - alert: NotionalOverDomainCap
        expr: increase(dreambuddy_notional_over_cap_total[5m]) > 0
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "下单名义超过域上限（{{ $labels.domain }}）"

      - alert: ForbiddenSymbolOrder
        expr: increase(dreambuddy_forbidden_symbol_orders_total[10m]) > 0
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "生产出现禁止/测试 symbol（{{ $labels.symbol }}）"

      - alert: DailyDrawdownBreach
        expr: dreambuddy_daily_drawdown_pct > dreambuddy_daily_drawdown_limit_pct
        for: 1m
        labels:
          severity: P0
          channel: alert
        annotations:
          summary: "日内回撤超过域上限（{{ $labels.domain }}）"

      - alert: ModelPerformanceDecay
        expr: avg_over_time(dreambuddy_model_ic_rolling[3h]) < 0
        for: 1h
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "模型滚动 IC 转负"

  - name: platform
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: P1
          channel: alert
        annotations:
          summary: "采集目标 {{ $labels.job }} / {{ $labels.instance }} 不可达"

      - alert: HostDiskWillFillIn24h
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 86400) < 0
        for: 10m
        labels:
          severity: P2
          channel: alert
        annotations:
          summary: "根分区预计 24h 内写满"
