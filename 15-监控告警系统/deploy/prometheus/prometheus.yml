# Prometheus 采集配置（v2.0 骨架）
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    host: VM-0-5-ubuntu
    stack: dreambuddy-monitoring

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["127.0.0.1:9091"]

  # 业务只读导出器（宿主机 systemd，不在 compose 内）
  - job_name: dreambuddy-business
    static_configs:
      - targets: ["127.0.0.1:9101"]

  # 黑盒探针：目标清单在 targets 中维护，模块定义见 blackbox/blackbox.yml
  # 约束：业务端口只绑 127.0.0.1，探针容器必须 network_mode: host，targets 一律写 127.0.0.1；
  #       禁用 host.docker.internal（它指向网桥网关 172.17.0.1，无法访问回环端口）。
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:3001          # 前端 Next 实例 1（根路径即健康页）
          - http://127.0.0.1:3002          # 前端 Next 实例 2
          - http://127.0.0.1:8765          # yijing-data-server 健康页在根路径（/health 为 404）
          - http://127.0.0.1:8771/health   # V15 决策 API
          - http://127.0.0.1:8093/health   # m26（根路径 404）
          - http://127.0.0.1:8099/health   # 8099 服务（根路径 404）
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 127.0.0.1:5432   # PostgreSQL（容器端口已发布到 127.0.0.1）
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
