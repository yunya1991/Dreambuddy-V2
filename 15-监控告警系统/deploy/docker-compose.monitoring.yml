# 15-监控告警系统 · 云端监控栈（v2.0 骨架）
# 用法（云端 /home/luke/dreambuddy/15-监控告警系统/deploy）：
#   cp /etc/dreambuddy-monitoring/monitoring.env .env   # 或 docker compose --env-file 指定
#   docker compose -f docker-compose.monitoring.yml up -d
# 约束：除 Grafana 外全部绑定 127.0.0.1；Grafana 由 nginx 子路径 /monitor/ 暴露。

name: dreambuddy-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    network_mode: host

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    network_mode: host

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in /etc/dreambuddy-monitoring/monitoring.env}
      # 交易系统看板只对本机开放（SSH 隧道访问），默认根路径；如需反代再覆盖两个变量
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_SUBPATH:-false}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    # 必须与宿主同网络命名空间：云端业务端口（3001/8765/8770/8771/8093-8096/9094）只绑 127.0.0.1，
    # 走容器网桥的 host.docker.internal(172.17.0.1) 打不到回环端口，会整批误报 TargetDown。
    network_mode: host
    # 覆盖 command 时必须显式带上 --config.file，否则镜像默认 CMD 被替换，会去 cwd 找 blackbox.yml 而启动失败
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: unless-stopped
    command:
      - --persistence.file=/pushgateway/data
      - --persistence.interval=5m
    volumes:
      - pushgateway-data:/pushgateway
    ports:
      - "127.0.0.1:9091:9091"

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  pushgateway-data:
