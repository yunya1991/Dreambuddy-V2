# Alertmanager 路由（v2.0 骨架）
# 唯一出口：feishu-receiver（宿主机 127.0.0.1:9098），由它复用 15/feishu_alert.py 发卡片。
route:
  receiver: feishu-desk
  group_by: ["alertname", "domain", "artifact", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
    # Watchdog 等 meta 通道常驻告警只供外部死手开关读取 Prometheus，
    # 不进飞书推送，避免每日一条 P3 噪声
    - matchers: ['channel="meta"']
      receiver: blackhole
      repeat_interval: 24h
    - matchers: ['severity="P0"']
      receiver: feishu-risk
      group_wait: 10s
      repeat_interval: 30m
    - matchers: ['severity="P1"']
      receiver: feishu-desk
      repeat_interval: 2h
    - matchers: ['severity="P2"']
      receiver: feishu-desk-p2
      repeat_interval: 4h
    - matchers: ['severity="P3"']
      receiver: feishu-management
      repeat_interval: 24h

inhibit_rules:
  # 同一目标 TargetDown 时，抑制其衍生的探针告警
  - source_matchers: ['alertname="TargetDown"']
    target_matchers: ['alertname=~"ArtifactStale|BusStale|Publish43Stale|Shadow50Stale"']
    equal: ["job"]

receivers:
  - name: blackhole
  - name: feishu-risk
    webhook_configs:
      - url: "http://127.0.0.1:9098/alert?level=P0"
        send_resolved: true
  - name: feishu-desk
    webhook_configs:
      - url: "http://127.0.0.1:9098/alert?level=P1"
        send_resolved: true
  - name: feishu-desk-p2
    webhook_configs:
      - url: "http://127.0.0.1:9098/alert?level=P2"
        send_resolved: true
  - name: feishu-management
    webhook_configs:
      - url: "http://127.0.0.1:9098/alert?level=P3"
        send_resolved: true
