<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent A Trading Monitor — Dreambuddy</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #7d8590; --green: #3fb950; --red: #f85149;
    --yellow: #d29922; --blue: #58a6ff; --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'SF Pro Text', sans-serif; font-size: 13px; }

  .header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .live { display: flex; align-items: center; gap: 6px; color: var(--green); font-size: 12px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .last-update { color: var(--muted); font-size: 11px; }

  .main { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

  /* Schedule Grid */
  .schedule-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .schedule-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
  .schedule-source { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .schedule-source.trae { color: var(--blue); }
  .schedule-source.actions { color: var(--purple); }
  .schedule-cron { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .schedule-status { font-size: 12px; }
  .status-active { color: var(--green); }
  .status-pending { color: var(--yellow); }
  .status-idle { color: var(--muted); }

  /* Comments */
  .comment { border-left: 3px solid var(--blue); padding: 12px 16px; margin-bottom: 12px; background: rgba(255,255,255,0.02); border-radius: 0 6px 6px 0; }
  .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .comment-source { font-weight: 600; font-size: 12px; }
  .comment-source.trae { color: var(--blue); }
  .comment-source.actions { color: var(--purple); }
  .comment-time { font-size: 11px; color: var(--muted); }
  .comment-content { font-size: 12px; line-height: 1.6; }
  .comment-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .meta-item { font-size: 11px; }
  .meta-label { color: var(--muted); }
  .meta-value { font-weight: 600; margin-top: 2px; }
  .action-long { color: var(--green); }
  .action-short { color: var(--red); }
  .action-hold { color: var(--muted); }

  .no-data { text-align: center; color: var(--muted); padding: 40px 0; font-style: italic; }

  /* Workflow Status */
  .workflow-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .workflow-item:last-child { border-bottom: none; }
  .workflow-name { font-weight: 600; }
  .workflow-time { font-size: 11px; color: var(--muted); }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { text-align: center; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 6px; }
  .stat-value { font-size: 24px; font-weight: 700; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Refresh button */
  button { background: var(--border); border: none; color: var(--text); padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button:hover { background: #444; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .loading { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <h1>🤖 Agent A Trading Monitor</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <div class="live"><div class="live-dot"></div>实时监控</div>
    <div class="last-update" id="last-update">加载中...</div>
    <button id="refresh-btn" onclick="loadAll()">刷新</button>
  </div>
</div>

<div class="main">

  <!-- 调度概览 -->
  <div class="card">
    <div class="card-title"><div class="dot"></div>三级调度架构</div>
    <div class="schedule-grid">
      <div class="schedule-item">
        <div class="schedule-source trae">Trae 云端任务</div>
        <div class="schedule-cron">北京时间 0/4/8/12/16/20:00</div>
        <div class="schedule-status status-active">✅ 已启用</div>
      </div>
      <div class="schedule-item">
        <div class="schedule-source actions">GitHub Actions</div>
        <div class="schedule-cron">北京时间 2/6/10/14/18/22:00</div>
        <div class="schedule-status status-active">✅ 已启用</div>
      </div>
      <div class="schedule-item">
        <div class="schedule-source" style="color:var(--yellow)">本地 Crontab</div>
        <div class="schedule-cron">最后兜底</div>
        <div class="schedule-status status-idle">⏸ 待配置</div>
      </div>
    </div>
  </div>

  <!-- 统计 -->
  <div class="card">
    <div class="card-title"><div class="dot"></div>执行统计</div>
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-value" id="stat-total">--</div>
        <div class="stat-label">总执行次数</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-trae" style="color:var(--blue)">--</div>
        <div class="stat-label">Trae 执行</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-actions" style="color:var(--purple)">--</div>
        <div class="stat-label">Actions 执行</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-hours">--</div>
        <div class="stat-label">最后执行距今</div>
      </div>
    </div>
  </div>

  <!-- 最新执行记录 -->
  <div class="card">
    <div class="card-title"><div class="dot"></div>执行记录（从 PR #52 获取）</div>
    <div id="comments-list">
      <div class="loading">加载中...</div>
    </div>
  </div>

</div>

<script>
const GITHUB_API = 'https://api.github.com';
const REPO = 'yunya1991/Dreambuddy-V2';
const PR_NUMBER = 52;

// 格式化时间
function timeAgo(dateStr) {
  if (!dateStr) return '--';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = (now - date) / 1000;
  
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';
  return Math.floor(diff/86400) + ' 天前';
}

function formatDate(dateStr) {
  if (!dateStr) return '--';
  const date = new Date(dateStr);
  return `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
}

// 解析评论内容
function parseComment(body) {
  const result = { action: '--', coin: '--', confidence: 0, source: 'Unknown' };
  
  // 检测来源
  if (body.includes('Trae')) result.source = 'Trae';
  else if (body.includes('GitHub Actions')) result.source = 'Actions';
  
  // 解析操作
  if (body.includes('LONG')) result.action = 'LONG';
  else if (body.includes('SHORT')) result.action = 'SHORT';
  else if (body.includes('CLOSE')) result.action = 'CLOSE';
  else result.action = 'HOLD';
  
  // 解析币种
  const coinMatch = body.match(/\*\*币种\*\*:\s*(\S+)/);
  if (coinMatch) result.coin = coinMatch[1];
  
  // 解析置信度
  const confMatch = body.match(/\*\*置信度\*\*:\s*(\d+)%/);
  if (confMatch) result.confidence = parseInt(confMatch[1]);
  
  return result;
}

// 渲染评论列表
function renderComments(comments) {
  const container = document.getElementById('comments-list');
  
  if (!comments || comments.length === 0) {
    container.innerHTML = '<div class="no-data">暂无执行记录</div>';
    return;
  }
  
  // 统计
  let traeCount = 0, actionsCount = 0;
  comments.forEach(c => {
    const parsed = parseComment(c.body);
    if (parsed.source === 'Trae') traeCount++;
    else if (parsed.source === 'Actions') actionsCount++;
  });
  
  document.getElementById('stat-total').textContent = comments.length;
  document.getElementById('stat-trae').textContent = traeCount;
  document.getElementById('stat-actions').textContent = actionsCount;
  
  // 最后执行时间
  if (comments[0]) {
    const hours = ((new Date() - new Date(comments[0].created_at)) / 3600000).toFixed(1);
    document.getElementById('stat-hours').textContent = hours + 'h';
  }
  
  // 渲染最近5条
  const recent = comments.slice(0, 5);
  container.innerHTML = recent.map(c => {
    const parsed = parseComment(c.body);
    const actionClass = parsed.action === 'LONG' ? 'action-long' : 
                        parsed.action === 'SHORT' ? 'action-short' : 'action-hold';
    const sourceClass = parsed.source === 'Trae' ? 'trae' : 'actions';
    
    return `
      <div class="comment">
        <div class="comment-header">
          <span class="comment-source ${sourceClass}">${parsed.source}</span>
          <span class="comment-time">${timeAgo(c.created_at)} · ${formatDate(c.created_at)}</span>
        </div>
        <div class="comment-content">${c.body.split('\n').slice(0, 6).join('<br>')}</div>
      </div>
    `;
  }).join('');
}

// 加载所有数据
async function loadAll() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '加载中...';
  
  try {
    // 获取 PR 评论
    const res = await fetch(`${GITHUB_API}/repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=20&sort=created&direction=desc`);
    
    if (!res.ok) throw new Error('API 请求失败');
    
    const comments = await res.json();
    renderComments(comments);
    
    document.getElementById('last-update').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch (e) {
    console.error(e);
    document.getElementById('last-update').textContent = '加载失败: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '刷新';
  }
}

// 初始加载
loadAll();

// 每分钟自动刷新
setInterval(loadAll, 60000);
</script>

</body>
</html>
