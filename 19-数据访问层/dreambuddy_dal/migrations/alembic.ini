# Alembic 配置 — 19-数据访问层
# Schema SemVer 与代码 SemVer 同号联动（ADR-19-005）
# 迁移链起点 = v1.0 P1 的 21 张表 + 20 索引 + 4 触发器

[alembic]
script_location = %(here)s
sqlalchemy.url = sqlite:///%(DATA_DIR)s/dreambuddy_core.db

# 版本表名（自定义，对齐 ma_schema_version）
version_table = ma_schema_version
version_table_schema = ma

# 时间戳格式
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev_id)s_%%(slug)s
truncate_slug_length = 40

# Python 路径
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
