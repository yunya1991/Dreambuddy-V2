# L2 提示词注册表（IF-P-1 v1.0）
#
# 性质：append-only 台账。只记录资产位置、版本、指纹与约束来源，**不复制任何 prompt 正文**。
# 规则：
#   1. 已发布（status != draft）的版本禁止原地修改，任何改动开新版本号。
#   2. status 只允许 draft → gated → active → deprecated，禁止跳级与回退。
#   3. fingerprint 与 asset_path 指向的内容必须一致；不符即 E_CONSTITUTION_DRIFT（G-P-2）。
#   4. source_files 只引用 PROMPT_CONSTITUTION.md §2 的 SRC id，不复述正文（56 ADR-02）。
#   5. P0 阶段全部为 draft：存量资产**未评测**（无 eval_suite），不得标 active。
#
# 指纹算法（fingerprint_algorithm）：
#   file  = sha256(原始字节)
#   tree  = sha256( 按相对路径字典序拼接 "<relpath>\n<file_sha256_hex>\n" )
#
# 校验：python3 56-L2架构能力聚合层/scripts/validate_contracts.py --prompts --constitution

schema_version: "1.1"
constitution_version: "1.0.0"
fingerprint_algorithm: "sha256(raw bytes) for file; tree = sha256(concat('<relpath>\\n<file_sha256>\\n' for sorted files))"

# P3：统一人格与免责口径（SPEC-57 §3.2）。运行时注入，禁止各入口各自维护。
persona:
  language: zh
  style: [结论先行, 紧凑无废话, 不用营销语, 不确定必须明说, 数字必须可回溯]
  disclaimer: "历史统计/模型推断，不代表未来"
  forbidden_marketing: [稳赚, 必赚, 保证收益, 零风险, 翻倍]

