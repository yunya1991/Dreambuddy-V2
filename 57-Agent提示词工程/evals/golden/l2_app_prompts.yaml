# L2 存量资产 golden set（SPEC-57 §8 P6）
#
# 用途：给「只登记未接入」的四个存量资产提供 ≥20 例评测基线。
# 判据：run_prompt_conformance.py 只做**确定性装配契约** A/B（宪法/人格/禁词/契约词），
#       不宣称模型质量；真实模型 A/B 仍走 run_prompt_ab.py（需宿主在线时执行）。
version: "1.0"
owner: "57-Agent提示词工程"

suites:
  # ---------- 3.1 前端技能提示（lite：P4 输出契约 + C-11） ----------
  - prompt_id: l2.app.skill
    task: skill.guide
    metric: conformance_rate
    min_cases: 20
    threshold:
      delta_pp_min: -3.0
      mcnemar_p_max: 0.20
      json_ok_rate_min: 95.0
    cases:
      - id: SK01
        input: "帮我看一下 BTC 现在的走势并给出操作建议"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK02
        input: "ETH 日线级别适合做多还是做空"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK03
        input: "SOL 最近三天为什么跌"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK04
        input: "帮我复盘昨天 BTC 的多单"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK05
        input: "现在适合开仓吗，仓位多少"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK06
        input: "我的止损应该放在哪里"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK07
        input: "这周有哪些重要宏观数据"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK08
        input: "帮我把 BTC 和 ETH 做对比"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK09
        input: "解释一下什么是资金费率"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK10
        input: "我的持仓风险大吗"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK11
        input: "帮我找一下今天的市场主线"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK12
        input: "BTC 跌破前低了吗"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK13
        input: "现在市场情绪怎么样"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK14
        input: "帮我设计一个低风险策略"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK15
        input: "为什么我的策略最近一直回撤"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK16
        input: "解释一下什么是凯利公式"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK17
        input: "帮我估算一下这笔交易的盈亏比"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK18
        input: "BTC 和美股的相关性如何"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK19
        input: "帮我看看这波反弹能不能持续"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]
      - id: SK20
        input: "现在我该不该减仓"
        expect_terms: ["P4 输出契约", "免责尾注", "C-11"]

