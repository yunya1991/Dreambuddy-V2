# 资产池定稿 v2（S1.0-2 → SPEC-54-L1交易层 §2，2026-11-15）
# ============================================================
# 定位：L1 确定性数据能力的「资产表」，分两层：
#   - anchors（核心锚定，8 个）：必须有 ≥3 年日频历史，支撑相关性/条件收益/分位
#     （S2/S3 输入基线）。**本段结构保持 v1 不变**（test_asset_pool.py 断言 8 个）。
#   - extended_anchors（扩展池）：五类视图成员，按类别展开时懒加载（ADR-V6）。
#     其中 OKX 代币化美股/短历史标的历史 < 3 年，用 per-anchor
#     history.min_rows + history_lt_3y 显式降级（B-LT5），不得静默判不合格。
#
# 定源规则（硬约束，SPEC §2.3）：
#   1. per-symbol 唯一定源：instrument.venue 显式声明，运行时不再跨源择优；
#      source_priority 只用于同一 (sub_category, metric) 重复入库时去重。
#   2. 长历史优先：Nasdaq/FRED 有 ≥750 天的一律用 Nasdaq/FRED；仅当二者缺失
#      才用 OKX（AMD/GEV/SPCX/SKHYNIX）。
#   3. 历史不足显式降级：sample_n < min_rows → status=partial，
#      n < 250 → degraded_reason=history_lt_250 且禁止点亮。
#   4. 代理必须标注：proxy=true（DJIA→DIA、SPCX→代币化标的、XAU→XAUT），
#      tokenized=true 表示代币化标的（非证券本体）。
#   5. 回填幂等：INSERT OR REPLACE，云端可重复执行。
#   6. 质量下限 per-anchor 覆盖：anchors[].history.min_rows 覆盖全局 quality；
#      全局 quality 段不动（1090/740 断言继续成立）。
#
# 候选（实测可入池、默认不进首屏，DAL 尚未回填，故不写入本表）：
#   MSTR / COIN / HOOD / PLTR / ORCL —— OKX *-USDT-SWAP，约 250 天（2026-02/03 起）。
#   DIA / BRK —— 无可用的可回填序列。
#
# 边界：其他代币不在本表逐一定义（dynamic 段按需取数）；代币基本面/叙事属 L2。
# ============================================================

version: 2
updated: "2026-11-15"
timezone_default: UTC

# 同一指标跨源重复时的取值优先级（仅去重，不做跨源择优）
source_priority:
  - okx
  - fred
  - coingecko
  - blockchain_info
  - panewslab

# 展示层五类视图（底层 asset_class 仍取 40 层，禁止另立枚举）
view_order:
  - 加密
  - 避险
  - 大宗
  - 美股
  - 情绪

quality:
  min_rows_3y: 1090          # 7×24 市场（okx）：3 年日历日 1095/1096，留 0.5% 容忍
  min_rows_3y_trading: 740   # 交易日市场（fred/nasdaq）：3 年约 756 个工作日，留 2% 容忍
  max_gap_ratio: 0.01        # 7×24 市场缺口率上限（日历日口径）
  max_gap_ratio_trading: 0.06 # 交易日市场缺口率上限（工作日口径，含美股假日约 4%）
  min_non_null_ratio: 0.95   # 非空率下限
  stale_days: 3              # 超过 3 天未更新视为陈旧

