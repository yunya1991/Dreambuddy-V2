# Discovery 搜索空间（预注册，SPEC-54 §15.2 / B3）
# ============================================================
# 定位：Discovery 的唯一搜索空间事实源。**预注册，运行时禁止扩张**：
#   - 序列池固定（资产池 + 宏观白名单，合计 ≤40 条）；
#   - 变换固定 6 种，方法固定 20 个（关系型子集）；
#   - 目标固定价格前瞻收益 h∈{1,5,20}；
#   - 预算 ≤5,000 单元/次、≤10 分钟、seed=42 冻结。
# 任何维度改动都视为新一期预注册：必须提升 version 并重跑基线，
# 禁止在既有 version 内追加序列/方法（否则 manifest 不可复现）。
#
# 硬规则（§15.5）：
#   1. 运行期不得写库、不得改本文件；结果只标 candidate；
#   2. BH-FDR 强制开启（alpha=0.05），禁止用 holdout 反复调参；
#   3. 分段固定 70/30，holdout 只做验证不参与选择；
#   4. 发现上限 50，信号去重阈值 |corr|>0.95。
# ============================================================

version: 1
updated: "2026-11-15"

# 冻结随机种子（§15.2 预算行）
seed: 42

# ---------------- 序列池（资产池 + 宏观白名单，≤40） ----------------
series:
  max_series: 40
  # 资产池序列：值必须是 config/asset_pool.yaml 中 anchors[].storage.sub_category
  assets:
    - BTC
    - ETH
    - SOL
    - NASDAQCOM
    - SP500
    - XAU
    - DCOILWTICO
    - DGS10
  # 宏观白名单：mm_metrics.sub_category（只读，不含任何新闻文本）
  macro:
    - VIXCLS
    - T10Y2Y
    - DTWEXBGS
    - crypto_fear_greed
    - btc_funding_rate
    - btc_open_interest
    - stablecoin_supply_usd
    - etf_net_flow_usd

# ---------------- 组合（三序列及以上禁） ----------------
combos:
  single: true
  pair: true
  max_pairs: 300

# ---------------- 变换（固定 6 种，顺序即枚举顺序） ----------------
transforms:
  - raw
  - diff
  - pct
  - zscore60
  - ts_rank60
  - quintile5

# ---------------- 方法（固定关系型子集，须在方法库登记） ----------------
methods:
  - M01
  - M02
  - M11
  - M12
  - B01
  - B02
  - B03
  - B04
  - B05
  - B11
  - B12
  - B13
  - B14
  - B15
  - R01
  - R02
  - R03
  - R04
  - SC52
  - SC62

# ---------------- 目标（默认价格前瞻收益） ----------------
targets:
  kind: price_forward_return
  horizons: [1, 5, 20]

# ---------------- 预算（超限截断并记录） ----------------
# 注：全量空间（16 序列 + 120 对）× 6 变换 × 20 方法 × 3 期限远超 5,000 单元，
# 这是预注册的常态；发现器必须按「单序列优先、再双序列，序列/变换/方法/期限」
# 的固定枚举顺序确定性截断到 max_units，并在 manifest 记录被截断的维度。
budget:
  max_units: 5000
  max_minutes: 10
  max_findings: 50

# ---------------- 统计与去重（不可关闭） ----------------
fdr:
  enabled: true
  alpha: 0.05
dedupe:
  corr_threshold: 0.95
split:
  screen_ratio: 0.7
  holdout_ratio: 0.3
  min_holdout_agreement: 0.6
