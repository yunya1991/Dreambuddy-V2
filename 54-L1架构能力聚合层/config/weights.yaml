# 动态权重实盘切换开关（SPEC-54 §4.13 / ADR-V18/V19 / L1D-08 切换层）
# ============================================================
# 灰度三档（默认 off，非法值直接抛错，不静默降级）：
#   off     不计算动态权重，轴向权重固定 40/25/20/15（与引入前字节一致）
#   shadow  计算并落库 weights_hash / axis_weights / weight_sources，但不注入 decide
#   on      计算并注入 decide；等权否决门未过（weight_fallback）时不注入，沿用静态先验
#
# 切换优先级：调用方显式参数 > 环境变量 L1_DYNAMIC_WEIGHTS > 本文件 > off
# 晋级/回滚：只改本文件或环境变量，signal 表 weights_hash 全程可审计
# ============================================================

weights:
  mode: "off"        # off | shadow | on
  window: 250        # 滚动估计窗口（交易日）
  min_labels: 250    # 等权否决门最小样本（ADR-V19）
