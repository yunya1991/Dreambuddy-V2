    notes: 五类分组看板（跨资产公共日期轴，ret_60 与 D-E12 同口径）；组内按 ret_60 降序，lit_n/warm_n 直接消费 D-E19 计数（LT-AC4 零重算）；样本低于 per-anchor 质量门时标 degraded_reason 并禁止点亮
  - id: D-E18
    intent: data_insight
    mode: deterministic
    data_scope: [market.candles]
    executor: capabilities.stats.flow_graph
    methods: [M01, M02]
    min_n: 60
    method_binding: display
    notes: 资金流向导图；ETF 净流入按滚动窗口 z-score 转 flow 边（>0 为流入资产），无 flow 数据时降级 corr-only 且绝不伪造边（LT-G7）；边严格 5 键 src/dst/kind/weight/p_adj
  - id: D-E19
    intent: trend_query
    mode: deterministic
    data_scope: [market.candles]
    executor: capabilities.stats.lights
    methods: [I37, I36]
    min_n: 500
    method_binding: display
    notes: 四轴（趋势/惯性/周期/前瞻）五态点亮投影；轴强度 = |轴值|/轴权重（零重算），cycle 取 I39 外部归一值不自行估计；lit/warm 阈值默认 p70/p40 且未标定时显式打标；样本门按 asset_pool per-anchor（代币化标的 250 硬门）独立控制，展示层不重算统计量
