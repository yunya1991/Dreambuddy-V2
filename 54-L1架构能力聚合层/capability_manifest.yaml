# 54 能力注册表（能力层唯一事实源，SPEC-54 §3.3 / §11.4）
# 规则：
#   1. 只能引用方法库已登记且 implemented=true 的 method_id（manifest.validate() 强制）；
#      method_binding=display（纯投影/展示能力）的 methods 只披露血缘，不参与执行覆盖统计；缺省 compute。
#   2. min_n 是「能力级最小样本」，方法级门禁仍由 l1agg.methods.registry 独立执行；
#   3. 新增能力 = 加一条 + 在 l1agg/capabilities/stats.py 提供同名 executor；
#   4. mode=deterministic 绕过记忆相似度门禁，gated 仍需 route_confidence >= 0.65。
version: 1
updated: "2026-11-15"
# 可见性（SPEC-54 §4.8 / ADR-V14）：缺省 public；执行类/方向类能力必须登记为 internal，
# internal 能力在 manifest.validate + assert_public 双重拦截，永不被前端/数据查询命中。
visibility_default: public
visibility_internal: []
capabilities:
  - id: D-A01
    intent: metric_series
    mode: deterministic
    data_scope: [datacenter.series]
    executor: capabilities.stats.history_series
    methods: [S25]
    min_n: 30
    notes: 单序列区间取点 + 日/周/月降采样（每区间取最后观测，同日重复取最后），输出 points/span/unit；当前历史分位由方法层 S25 真实执行，能力层不重算统计量；日期轴必填且等长，缺失率 >20% 降级 partial（sparse_series），样本 <30 或非法 freq FAIL-OPEN 为 empty
  - id: D-A02
    intent: metric_series
    mode: deterministic
    data_scope: [datacenter.series]
    executor: capabilities.stats.change_rate
    methods: [S15, S16]
    min_n: 2
    notes: 序列末值与 window 期前值比较，S15 输出绝对变化、S16 输出变化率；window<1 或样本不足以覆盖区间 FAIL-OPEN 为 empty；基期值为 0 时变化率不可用降级 partial（change_pct_unavailable）并保留绝对变化
  - id: D-A03
    intent: metric_series
    mode: deterministic
    data_scope: [datacenter.series]
    executor: capabilities.stats.cagr
    methods: [S19]
    min_n: 2
    notes: 首末值年化复合增长率；提供 dates 时按首末日历天数折算年数，否则按 n-1 天；跨度不足 1 年降级 partial（short_span）并提示仅供参考；起止值非正、首末日期跨度非正、样本 <2 或日期无效 FAIL-OPEN 为 empty
  - id: D-A04
    intent: metric_percentile
    mode: deterministic
    data_scope: [datacenter.series]
    executor: capabilities.stats.percentile_rank
    methods: [S25]
    min_n: 30
    notes: 末值在最近 lookback 期历史中的分位（S25：100×count(X≤x_last)/n，无未来函数），输出 percentile/value/lookback/sample_n；lookback 缺省取全样本，指定时须 ≥30；窗口 <60 期降级 short_lookback，lookback 超过可用历史降级 lookback_truncated 并按可用样本计算；样本 <30、非法 lookback、长度不一致或日期无效 FAIL-OPEN 为 empty
  - id: D-A06
    intent: metric_series
    mode: deterministic
    data_scope: [datacenter.series]
    executor: capabilities.stats.annualized_volatility
    methods: [F05]
    min_n: 30
    notes: 日简单收益标准差 × √365 年化（F05），输出 volatility/mean_ret/window/sample_n；window 缺省取全样本、指定时须 ≥30；有效样本 <60 期降级 short_window；样本 <30、window<30、日期长度不一致或含非有限值 FAIL-OPEN 为 empty
  - id: D-A07
    intent: drawdown_query
    mode: deterministic
    data_scope: [market.candles]
    executor: capabilities.stats.drawdown
    methods: [D20, D21]
    min_n: 250
    notes: 单序列回撤画像（与 D-E10 共用执行器，注入 capability_id=D-A07）：D20 最大回撤与峰谷索引 + D21 回撤持续/收复天数，输出 drawdown/peak_ts 及 mdd/current_drawdown/duration_days/drawdown_path；价格 <2 点 FAIL-OPEN 为 empty，样本 <250 期降级 insufficient_samples
  - id: D-A08
    intent: metric_series
    mode: deterministic
    data_scope: [datacenter.series]
    executor: capabilities.stats.yoy_change
    methods: [S16]
    min_n: 13
    notes: 与 period 期前比较的同比（S16 变化率，period 默认 12），输出 yoy/base_ts/period/sample_n；样本须 >period 且 ≥13；历史不足 2 个完整周期（len<2×period+1）降级 short_history，基期值为 0 降级 yoy_unavailable；长度不足以覆盖 period、period<1、日期长度不一致或含非有限值 FAIL-OPEN 为 empty
  - id: D-A09
    intent: metric_series
    mode: deterministic
    data_scope: [datacenter.series]
    executor: capabilities.stats.mom_change
    methods: [S16]
    min_n: 2
    notes: 与上一期比较的环比（S16 变化率，k=1），输出 mom/base_ts/sample_n；至少 2 个有效点；基期值为 0 时 mom=None 并降级 mom_unavailable；样本 <2、日期长度不一致或含非有限值 FAIL-OPEN 为 empty
  - id: D-A10
    intent: metric_derived
    mode: deterministic
    data_scope: [datacenter.series]
    executor: capabilities.stats.real_rate
    methods: [S16]
    min_n: 13
    notes: 实际利率 = 名义利率（如 DGS10）− CPI 同比通胀；通胀唯一由 S16（k=period，默认 12）真实执行并折算为百分点，能力层只做差值组合，输出 real_rate/nominal/inflation/base_ts/period/sample_n；CPI 基期为 0 时通胀与实际利率均不可计算并降级 inflation_unavailable；样本不足 2 个完整周期降级 short_history；样本不足以覆盖 period、period<1、双序列长度不一致、日期长度不一致或含非有限值 FAIL-OPEN 为 empty
  - id: D-A11
    intent: correlation_query
    mode: deterministic
    data_scope: [datacenter.series]
    executor: capabilities.stats.rolling_correlation
    methods: [M04]
    min_n: 60
    notes: 双序列滚动 Pearson 相关；按原始位置 paired complete-case 后由 M04 计算窗口相关，输出 corr（最近窗口）/mean_r/window/n_windows/sample_n；有效配对 <60 降级 insufficient_samples 但保留结果；有效配对 <2、window<2 或 window 超出配对样本、日期长度不一致或含非有限值 FAIL-OPEN 为 empty
  - id: D-A12
    intent: correlation_query
