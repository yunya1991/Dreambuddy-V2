    notes: 距历史高（ATH）回撤；复用 D-E10 `drawdown` 执行器（D20 回撤画像 + D21 持续期），能力层只做 max/索引取点与别名映射（drawdown_from_ath/ath/ath_ts 分别等于 current_drawdown/peak_price/peak_ts），不重算回撤统计量；价格样本 <2 或全无效值 FAIL-OPEN 为 empty；样本 <250 降级 insufficient_samples 但保留结果
  - id: D-G08
    intent: metric_derived
    mode: deterministic
    data_scope: [market.candles]
    executor: capabilities.stats.momentum_12_1
    methods: [F14]
    min_n: 60
    notes: 12-1 动量（跳过最近 skip 期、回溯 lookback 期的累计收益）；F14 在被切片后的窗口上真实执行动量/波动/风险调整动量，能力层只做窗口切片（数据整形）与百分比换算，不重算统计量；lookback 默认 252、skip 默认 21，历史不足时截断 lookback 并降级 short_history，价格样本 <60、lookback<2、skip<0、非整数参数、日期长度不一致或含非有限值 FAIL-OPEN 为 empty
  - id: D-G09
    intent: metric_derived
    mode: deterministic
    data_scope: [market.candles]
    executor: capabilities.stats.vol_target_scale
    methods: [P02]
    min_n: 60
    notes: 波动率目标换算（scale = 目标波动 / 窗口内实现波动）；价格序列先转日简单收益（数据整形），再由 P02 计算实现波动与缩放系数，能力层不重算波动率；target_vol 默认 0.10、window 默认 20、periods 默认 365；收益样本 <60、target_vol≤0 或非数值、window<2、periods<1、日期长度不一致或含非有限值 FAIL-OPEN 为 empty；window 超过收益长度时截断并降级 window_truncated，实现波动为 0 时降级 zero_volatility；系数仅为样本内比值，不构成交易建议
  - id: D-E15
    intent: trend_query
    mode: deterministic
    data_scope: [market.candles]
    executor: capabilities.stats.trend
    methods: [I02, T08, I32, I37]
    min_n: 250
    notes: EMA(12/26/50) 平滑 + 多窗口对数价格斜率(20/60/120/250) + ADX14，可选 I37 Kalman 局部线性趋势；T2 曲线与 L1-D 方向输入；对外只给统计事实
  - id: D-E16
    intent: trend_query
    mode: deterministic
    data_scope: [market.candles]
    executor: capabilities.stats.aggregate_curve
    methods: [S16]
    min_n: 60
    method_binding: display
    notes: 多成员加权聚合曲线；成员先按自身首日 rebase 再按 chart_weights 加权，缺口不向前填充，逐点给出 coverage_ratio/partial_members；曲线口径只聚合展示，不含交易方向
  - id: D-E17
    intent: cross_check
    mode: gated
    data_scope: [market.candles]
    executor: capabilities.stats.class_board
    methods: [S16, S25, M01, I32]
    min_n: 60
