    data_scope: [datacenter.series]
    executor: capabilities.stats.lead_lag_correlation
    methods: [M11, M12]
    min_n: 120
    notes: lag 0–max_lag（默认 10）的领先滞后相关；paired complete-case 后由 M11 输出全 lag 相关/p/BH-FDR q/显著性，M12 输出最优 lag，能力层组装 corr_by_lag[] 与 best_lag/best_corr/best_p_adj；有效配对 <120 降级 insufficient_history 但保留结果；配对 <2、max_lag<1 或超出配对样本、日期长度不一致或含非有限值 FAIL-OPEN 为 empty；结论不自动等于因果或未来可预测
