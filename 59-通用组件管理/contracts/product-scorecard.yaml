# SkillHub 产品优化评分卡（单一源）
#
# 分工（与 contracts/skill-quality-rules.yaml 不重叠）：
#   合规链 skill-quality-rules.yaml 回答「能不能上架」：frontmatter / 402 / 密钥 / 体积
#   优化链 本文件                 回答「agent 会不会选你」：召回 / 区分 / 信任 / 转化 / 可用
# 修改后必须 bump version 并在 changelog 追加一条；`cli.py card --check` 会校验。
#
# check.type 仅支持 8 种（全部纯文本/正则，离线确定性）：
#   entity_hit / intent_term / bilingual / boundary_declared /
#   cross_field_dup / length_range / field_present / evidence_present / family_distinct
# applies_to 取值：skill_md / mcp_tool / product_page / packaging

version: 3
updated_at: "2026-11-21"
changelog:
  - version: 1
    summary: "初版：5 维 20 规则，覆盖 SKILL.md / MCP 工具 / 商品页 / 定价包装"
  - version: 2
    summary: "按真实 MCP 面与存量商品校准：实体门槛降到 1 并新增 3 实体告警；边界降为 warn；新增空描述 blocker；定价仅对收费渠道必填"
  - version: 3
    summary: "四商品校准：补 A股/美股/港股/行情/宏观/指标类实体；CON002 改为按词表整词比对（消除「据服/件上」等滑窗碎片误报）；RET002 只约束 SKILL.md 并补 适合/面向/覆盖 等触发词（商品页不再因缺「当用户」被误判 D 级）"

profiles:
  # 新增商品：blocker 硬阻断，总分低于阈值告警
  new:
    enforce: [blocker]
    total_warn: 75
  # 存量商品：只挡 blocker，避免历史商品一夜卡死
  legacy:
    enforce: [blocker]
    total_warn: 60

thresholds:
  grade_a: 90
  grade_b: 75
  grade_c: 60

dimensions:
  retrievability:
    label: 可召回
    weight: 30
  distinctiveness:
    label: 可区分
    weight: 25
  trust:
    label: 可信任
    weight: 20
  conversion:
    label: 转化
    weight: 15
  operability:
    label: 可用
    weight: 10

# 用户会直接说出的实体词表（来自 intents.yaml 与真实商品页）
