# 跨字段重复词的白名单：这些词在标题与副标题同时出现是正常的
dup_whitelist: [a股, 指数, 数据, 服务, 市场, 事实, 上下文, 事件, 专业版, 助手]

rules:
  # ---------- 可召回 ----------
  - id: RET001
    title: 描述含用户原话实体
    dimension: retrievability
    severity: blocker
    applies_to: [skill_md, mcp_tool]
    weight: 12
    check: {type: entity_hit, field: description, min: 1}
    messages:
      fail: 描述里没有任何用户会直接说出的实体（公司名、代码、表单类型、指数名）
      advice: 按「能力 + 用户原话实体 + 边界」重写，至少补 1 个实体

  - id: RET005
    title: 实体覆盖足够（≥3）
    dimension: retrievability
    severity: warn
    applies_to: [skill_md, mcp_tool]
    weight: 6
    check: {type: entity_hit, field: description, min: 3}
    messages:
      fail: 描述里的实体少于 3 个，短问句容易召回不到
      advice: 再补 1–2 个用户常说的实体（如具体表单、指数、场馆）

  - id: RET002
    title: 描述含意图触发短语
    dimension: retrievability
    severity: warn
    applies_to: [skill_md]
    weight: 6
    check:
      type: intent_term
      field: description
      terms: [当用户, 用于, 适用于, 适合, 面向, 覆盖, 帮你, 使用, 查, 统计, 查询]
    messages:
      fail: 描述缺少「当用户……时使用」类触发短语
      advice: 在描述中补一句用户会怎么说（引用原话即可）

  - id: RET003
    title: tags 中英双语
    dimension: retrievability
    severity: warn
    applies_to: [skill_md]
    weight: 5
    check: {type: bilingual, field: tags, min_ascii: 1, min_cjk: 2}
    messages:
      fail: tags 缺少英文或中文词，跨语言检索会漏召回
      advice: tags 补 1 个英文词与 2 个中文实体词

  - id: RET004
    title: 示例覆盖真实说法
    dimension: retrievability
    severity: warn
    applies_to: [skill_md]
    weight: 4
    check: {type: evidence_present, field: examples, min: 2}
    messages:
      fail: 示例少于 2 条，agent 缺少可复制触发样本
      advice: 补 3 条用户会直接复制的中文示例

  # ---------- 可区分 ----------
  - id: DIS001
    title: 声明不适用范围
    dimension: distinctiveness
    severity: warn
    applies_to: [mcp_tool]
    weight: 10
    check:
      type: boundary_declared
      fields: [not_for, description]
      markers: [不, 禁, 不含, 不用于, 不查, 不做, 不给, 不预测]
    messages:
      fail: 未声明边界，容易被越界误选
      advice: 补一句「不用于……」，让 agent 明确排除场景

  - id: DIS004
    title: MCP 工具描述非空且可读
    dimension: distinctiveness
    severity: blocker
    applies_to: [mcp_tool]
    weight: 8
    check: {type: length_range, field: description, min: 10}
    messages:
      fail: MCP 工具描述为空或过短，agent 无法判断用途
      advice: 在 component.yaml 的 action 上补一句能力描述

  - id: DIS002
    title: when_to_use 与 not_for 成组
    dimension: distinctiveness
    severity: warn
    applies_to: [mcp_tool]
    weight: 8
    check: {type: field_present, fields: [when_to_use, not_for]}
    messages:
      fail: MCP 工具缺少 when_to_use 或 not_for
      advice: 在 component.yaml 的 action 上成组补齐 when_to_use 与 not_for

  - id: DIS003
    title: 同族工具名有区分
    dimension: distinctiveness
    severity: warn
    applies_to: [mcp_tool]
    weight: 7
    check: {type: family_distinct}
    messages:
      fail: 同族工具名无独有词，语义重叠
      advice: 至少保留一个只属于本工具的意图词（如 quote / filing / facts）

  # ---------- 可信任 ----------
  - id: TRU001
    title: 有可复制示例
    dimension: trust
    severity: warn
    applies_to: [skill_md]
    weight: 7
    check: {type: evidence_present, field: examples, min: 1}
    messages:
      fail: 没有可复制示例
      advice: 补一段「装好后直接说」的示例

  - id: TRU002
    title: 有输出样例
    dimension: trust
    severity: info
    applies_to: [skill_md]
    weight: 4
    check: {type: field_present, fields: [output_sample]}
    messages:
      fail: 未展示输出样例
      advice: 补 5–10 行真实输出，买家能判断是否可用

  - id: TRU003
    title: 许可证已声明
    dimension: trust
    severity: warn
    applies_to: [skill_md, product_page]
    weight: 4
    check: {type: field_present, fields: [license]}
    messages:
      fail: 未声明 license
      advice: "frontmatter 补 license：MIT（或商业授权）"

  - id: TRU004
    title: 版本号语义化
    dimension: trust
    severity: warn
    applies_to: [skill_md]
    weight: 5
    check: {type: length_range, field: version, pattern: "^\\d+\\.\\d+\\.\\d+$"}
    messages:
      fail: version 不是 x.y.z 语义化版本
      advice: 改成 1.0.4 这类三段式版本

  # ---------- 转化 ----------
  - id: CON001
    title: 标题长度适合列表展示
    dimension: conversion
    severity: warn
    applies_to: [product_page]
    weight: 5
    check: {type: length_range, field: title, min: 4, max: 30}
    messages:
      fail: 标题过长或过短，列表页会被截断
      advice: 标题控制在 30 字内，先写能力词

  - id: CON002
    title: 标题/副标题/keywords 不重复词
    dimension: conversion
    severity: warn
    applies_to: [product_page]
    weight: 8
    check: {type: cross_field_dup, fields: [title, subtitle, keywords]}
    messages:
      fail: 标题、副标题与关键词重复用词，浪费检索位
      advice: 按 ASO 规则：同一词只出现一次，副标题补场景，关键词补长尾

  - id: CON003
    title: 描述前段讲清解决什么问题
    dimension: conversion
    severity: warn
    applies_to: [skill_md, product_page]
    weight: 7
    check: {type: length_range, field: description, min: 40}
    messages:
      fail: 描述过短，讲不清解决的问题
      advice: 前 80 字写「用户什么场景 + 得到什么」，不写内部术语

  - id: CON004
    title: 定价与售卖模式明确
    dimension: conversion
    severity: blocker
    applies_to: [packaging]
    weight: 10
    check:
      type: field_present
      fields: [price, mode]
      when:
        field: channel
        in: [skillpay-subscription, skillpay-once, skillhub-pay]
    messages:
      fail: 缺少价格或售卖模式
      advice: 在 products/*.yaml 明确 price 与 channel（买断/订阅/按次）

  # ---------- 可用 ----------
  - id: OPE001
    title: 提供首跑命令
    dimension: operability
    severity: warn
    applies_to: [skill_md]
    weight: 6
    check: {type: evidence_present, field: first_run_cmd}
    messages:
      fail: 没有可直接运行的命令
      advice: 补一条 python3 scripts/xxx.py 的最小命令

  - id: OPE002
    title: 说明错误码与降级
    dimension: operability
    severity: info
    applies_to: [skill_md]
    weight: 4
    check: {type: field_present, fields: [error_codes]}
    messages:
      fail: 未说明出错时的表现
      advice: 补「数据不可用 / E_ENV」等错误语义

  - id: OPE003
    title: MCP 工具声明输出契约
    dimension: operability
    severity: info
    applies_to: [mcp_tool]
    weight: 3
    check: {type: field_present, fields: [output]}
    messages:
      fail: action 未声明 output 契约
      advice: "在 component.yaml 的 action 上补 output：json"
