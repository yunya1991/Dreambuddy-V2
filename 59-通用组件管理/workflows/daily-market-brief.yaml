id: daily-market-brief
version: 1
owner: 59-domain
schedule: "30 8 * * 1-5"
limits: {timeout_sec: 900, retries: 1}
steps:
  - id: facts
    use: market-facts-daily.facts
    params: {symbols: "sh000001,sz399001,sz399006", window: 60}
    out: facts.json
  - id: report
    use: research.render
    needs: [facts]
    out: report.md
    human_gate: A
  - id: blog
    use: site.blog_draft
    needs: [report]
    out: blog-draft.md
    human_gate: B
  - id: social
    use: content.social_pack
    needs: [report]
    out: social-pack.json
    human_gate: C
  - id: phone_fill
    use: mobile-reservation-assist.xhs-post
    needs: [social]
    params: {note: "social-pack.json"}
    allow_write: true
    human_gate: D
  - id: metrics
    use: ops.metrics_record
    needs: [blog, phone_fill]
    when: "T+1"
