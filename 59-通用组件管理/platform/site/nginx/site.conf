# 59 通用组件管理 · 站点与后台
#
# 部署路径：/opt/dreambuddy-59-site（由 platform/site 同步）
# 后端：skillhub-audit-api
#   8788  公开接口（systemd 托管）
#   8789  管理接口（仅 loopback，需要 X-Admin-Token）
#
# 安装：
#   sudo cp site.conf /etc/nginx/sites-available/dreambuddy-59-site
#   sudo ln -sf /etc/nginx/sites-available/dreambuddy-59-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：8082 的 X-Admin-Token 必须与 /etc/skillhub-audit/audit.env 的 ADMIN_TOKEN 一致。

server {
    listen 8081;
    server_name _;

    root /opt/dreambuddy-59-site;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/dreambuddy-59-site.access.log;
    error_log  /var/log/nginx/dreambuddy-59-site.error.log;

    # ── 安全头（SPEC §5.7；CSP 暂留 style-src 'unsafe-inline'）────────────
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # ── 公开接口：免费体检 /api/trial、付费体检 /api/audit、埋点 /api/beacon ─
    # 只向应用传递 X-Real-IP，应用不再信任可伪造的 X-Forwarded-For。
    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    # ── 后台资源不在公网暴露（后台统一走 8082）───────────────────────────
    location = /admin.html {
        return 404;
    }

    location /data/ {
        return 404;
    }

    # ── 静态资源 ─────────────────────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ── 管理后台：仅 loopback + Basic Auth + 8789 token ─────────────────────
server {
    listen 127.0.0.1:8082;
    server_name _;

    root /opt/dreambuddy-59-site;
    index admin.html;
    charset utf-8;

    access_log /var/log/nginx/dreambuddy-59-site-admin.access.log;
    error_log  /var/log/nginx/dreambuddy-59-site-admin.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    auth_basic "59 Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-59site;

    location = / {
        return 302 /admin.html;
    }

    location = /admin.html {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /data/ {
        try_files $uri =404;
    }

    # 后台健康与统计：注入 token 后反代 8789
    location = /api/health {
        proxy_pass http://127.0.0.1:8789/health;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Token "REPLACE_WITH_ADMIN_TOKEN";
        proxy_read_timeout 15s;
    }

    location = /api/stats {
        proxy_pass http://127.0.0.1:8789/api/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Token "REPLACE_WITH_ADMIN_TOKEN";
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
