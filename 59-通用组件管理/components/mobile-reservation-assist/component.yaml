  not_for: 不生成草案、不改手机端脚本
  script: scripts/mra.py
  args:
  - explore
  - baseline
  safety: write
  output: json
  params:
  - name: id
    flag: --id
    type: integer
    required: true
    description: 录制会话 ID
  - name: name
    flag: --name
    type: string
    required: true
    description: 基线/适配器名
- name: regression-add
  description: 登记回归用例：基线 + 录制会话 + 期望结果
  when_to_use: 平台改版后扩充兼容性回归集
  not_for: 不执行用例（用 regression run）
  script: scripts/mra.py
  args:
  - regression
  - add
  safety: write
  output: json
  params:
  - name: case_id
    flag: --case-id
    type: string
    required: true
    description: 用例 ID
  - name: baseline
    flag: --baseline
    type: string
    required: true
    description: 适配器基线名
  - name: id
    flag: --id
    type: integer
    required: true
    description: 录制会话 ID
  - name: expect
    flag: --expect
    type: string
    enum:
    - compatible
    - incompatible
    description: 期望结果
  - name: tags
    flag: --tags
    type: string
    description: 逗号分隔标签
