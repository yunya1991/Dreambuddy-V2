# MCP 契约注册表 — L0 对外协议面唯一事实源（SPEC §3.7 / PLAN M1①）
# 硬约束：文件 + CI 校验为唯一门禁；不加载运行时注册表（跨进程不可行）。
#
# Schema v1.0-mcp（原始）+ v1.1-mcp（B4 外部调研增量）
# =====================================================
# v1.0 字段：
#   shell_id / transport / shell_cmd / shell_path / envelope_version /
#   tools[].{domain, read_write, annotations, requires_mandate, port}
#
# v1.1 增量（B4，Google A2A Agent Card 自描述概念采纳）：
#   shell.capabilities.{shadow_capable, training_hooks, oracle_verifiable}
#   — 每个壳自描述是否支持影子旁路观察 / 训练基座 TB1-TB5 钩挂点 / Oracle 验证层 cross-check
#   — 壳运行时自动注入 envelope.meta.{shadow_capable, oracle_verifiable, config_version}
#   — COMM-SHADOW 影子观察器消费这些元字段做版本对账 + 旁路判断
#
# 字段词典（v1.1 完整）：
#   shell_id       全局唯一（kebab-case），C6 capabilities.yaml capability_id 加 .mcp 后缀对齐
#   transport      stdio / ssh-stdio / http / in-process（枚举）
#   shell_cmd      拉起命令（stdio）；http 则填 base_url；in-process 填 module::class
#   envelope_version 统一信封语义版本（本 v1=0.1，M1③ 信封映射层落地后迭代）
#   tools[].port   隶属 L0-P port（memory/collector/search/store/analysis/event）
#   tools[].domain L0 域语义（cognition/search/semantic/data/eval/rea/store-admin）
#   tools[].read_write 读/写/读写（枚举）
#   tools[].requires_mandate 写工具是否需要宿主 Mandate 授权（SPEC §3.3）
#   tools[].annotations MCP tool annotations：readOnlyHint=true/false
#   capabilities.shadow_capable  此壳是否支持 COMM-SHADOW 影子旁路观察（B4 v1.1 新增）
#   capabilities.training_hooks  TB1-TB5 训练基座可钩挂点列表（on_verify / on_recall / on_drift_alert）
#   capabilities.oracle_verifiable 此壳产出是否可被 Oracle 验证层 cross-check（B5）
schema_version: "1.1-mcp"
registry_version: "0.4"
last_updated: "2026-11-05"
# 单一载体声明（B4）：本文件为 MCP 壳/工具面唯一事实源
# 46-DSH 消费方（Worker capability set）应引用本文件字段，不重复定义
single_source_of_truth: true

# ── 存量三壳（已在线运行）─────────────────────────────────────────
# 壳不计入 SPEC-L0 §3.1 port 上限 6（壳是协议转换层，非 port 实现）
shells:
  # 壳 ① 认知+检索（含 unified_search，C7 已挂入）
  # 跨 domain 说明：此壳含 cognition + search 两类工具——recall 是认知域
  # 内部向量检索（Memory port），unified_search 是 Search 域跨源统一门面
  # （三后端：41 文档索引 + Chroma RAG + recall）；因 unified_search 第三
  # 后端必须同进程调 recall，C7 决策同 server 承载，零 IPC 开销
  - shell_id: l0.cognition.mcp
    capability_id: l0.cognition     # 对齐 C6
    transport: ssh-stdio             # D5 双模：默认 ssh 云端；本地 profile 切 stdio
    shell_path: "4-MEMORY/9-工具与接口/cognitive_mcp_server.py"
    shell_cmd: "python3 {path}"
    envelope_version: "0.1"          # M1③ 信封映射层落地后迭代
    status: available
    capabilities:                    # B4 v1.1-mcp 增量（Google A2A Agent Card 概念采纳）
      shadow_capable: true           # COMM-SHADOW 影子可旁路观察
      training_hooks: [on_verify, on_recall, on_record, on_drift_alert]  # TB1-TB5 可钩挂点
      oracle_verifiable: true        # Oracle 验证层可 cross-check
    tools:
      - name: recall
        port: memory
        domain: cognition
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: unified_search         # 检索域工具并入认知壳（§3.1 注②）
        port: search
        domain: search
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: record
        port: memory
        domain: cognition
        read_write: write
        requires_mandate: true       # 写工具需宿主 Mandate 授权
        annotations: { readOnlyHint: false, destructiveHint: true }
      - name: verify
        port: memory
        domain: cognition
        read_write: write
        requires_mandate: true
        annotations: { readOnlyHint: false, destructiveHint: true }
      - name: stats
        port: memory
        domain: cognition
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: health
        port: memory
        domain: cognition
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }

  # 壳 ② 金融语义蒸馏系统（39）——Search 域独立第三面；不新增 port
  # 与 unified_search 边界：unified_search 面向"找文档/找记忆"，39 面向
  # "实体解析/别名蒸馏/金融语义字典"——质不同源，独立 server 承载避免污染
  - shell_id: l0.semantic-39.mcp
    capability_id: l0.search.semantic39   # C6 无此 capability_id（39 纳入 L0 但不新增 port）
    transport: stdio
    shell_path: "39-金融语义蒸馏系统/scripts/mcp_server.py"
    shell_cmd: "python3 {path}"
    envelope_version: "0.1"
    status: available
    tools:
      - name: query_entity
        port: search
        domain: semantic
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: semantic_lookup
        port: search
        domain: semantic
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: distill_aliases
        port: search
        domain: semantic
        read_write: write
        requires_mandate: true
        annotations: { readOnlyHint: false, destructiveHint: true }
      - name: training_feed
        port: search
        domain: semantic
        read_write: write
        requires_mandate: true
        annotations: { readOnlyHint: false, destructiveHint: true }

  # 壳 ③ REA 壳（M3⑦ 落地）：两段式异步 submit/poll × analyze/trace/compare 共 6 工具
  # 异步工具强制配持久层（JSONL job store），无持久层不得暴露（SPEC-L0 §3.2）
  - shell_id: l0.rea.mcp
    capability_id: l0.rea
    transport: stdio
    shell_path: "mcp_shells/l0_rea/server.py"
    shell_cmd: "python3 {path}"
    envelope_version: "0.1"
    status: available                  # M3⑦
    tools:
      - name: submit_rea_analyze
        port: analysis
        domain: rea
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: poll_rea_analyze
        port: analysis
        domain: rea
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: submit_rea_trace
        port: analysis
        domain: rea
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: poll_rea_trace
        port: analysis
        domain: rea
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: submit_rea_compare
        port: analysis
        domain: rea
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: poll_rea_compare
        port: analysis
        domain: rea
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }

  # 壳 ③-b 存量 consumer 面（npm rea-agents 133 工具，npm 包接入未落地）
  # M3⑦ 起 REA 能力由上方 l0.rea.mcp 承载；本面保留登记（V6 存量面不删）
  - shell_id: l0.rea-client.mcp
    capability_id: l0.rea
    transport: http                    # 实际调 npm rea-agents HTTP 端点
    shell_path: ""                     # client 壳薄，无独立脚本
    shell_cmd: "rea-agents"            # 占位；落地时以 npm 包/IPC 接入
    envelope_version: "0.1"
    status: deprecated                 # 被 l0.rea.mcp 取代（M3⑦）
    tools:
      - name: rea_analyze
        port: analysis
        domain: rea
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: rea_trace
        port: analysis
        domain: rea
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: rea_compare
        port: analysis
        domain: rea
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }

# ── 新增三壳（M2⑤/M4⑩ 已落地，v0.2 起并入 shells 序列）──────────────
# data / eval / store-admin 三壳代码已建成（mcp_shells/l0_{data,eval,store_admin}），
# v0.2 由 planned_shells 迁入正式 shells 列表，status 统一 available。
# 新壳未经本注册表登记不得上线（R6 漂移门禁）。
  - shell_id: l0.data.mcp
    capability_id: l0.data
    transport: stdio
    shell_path: "mcp_shells/l0_data/server.py"
    shell_cmd: "python3 {path}"
    envelope_version: "0.1"            # 与 envelope_wrap 实现一致
    status: available                  # M2⑤
    tools:
      - name: data_fetch
        port: collector
        domain: data
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: data_collect_once
        port: collector
        domain: data
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: data_store_read
        port: store
        domain: data
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      # 写面 Ban 默认禁，Mandate 授权后开放（SPEC §3.3）
      - name: data_store_write
        port: store
        domain: data
        read_write: write
        requires_mandate: true
        annotations: { readOnlyHint: false, destructiveHint: true }

  - shell_id: l0.eval.mcp
    capability_id: l0.rea               # 评测属 analysis 域，复用 l0.rea（C6 仅 5 个 capability_id，不新增）
    transport: stdio
    shell_path: "mcp_shells/l0_eval/server.py"
    shell_cmd: "python3 {path}"
    envelope_version: "0.1"            # 与 envelope_wrap 实现一致
    status: available                  # M2⑥
    tools:
      - name: eval_analyze
        port: analysis
        domain: eval
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: eval_report
        port: analysis
        domain: eval
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }

  - shell_id: l0.store-admin.mcp
    capability_id: l0.store             # 库管属 store 管理面
    transport: stdio
    shell_path: "mcp_shells/l0_store_admin/server.py"
    shell_cmd: "python3 {path}"
    envelope_version: "0.1"            # 与 envelope_wrap 实现一致
    status: available                  # M4⑩
    tools:
      - name: store_admin_status
        port: store
        domain: store-admin
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: store_admin_query
        port: store
        domain: store-admin
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }

  # 壳 ⑦ 交易执行 MCP（SPEC-L0-TRADE-EXEC-MCP v0.2 落地）
  # 硬约束：仅承载 paper 模拟盘模式，绝不触真实交易所；
  # 实盘 live 由 11 域 okx_client 旁路网关直连，不经过本壳。
  # 壳内无 OKX API credentials、无签名逻辑、仅 HTTP GET 公开 ticker。
  - shell_id: l0.trade-exec.mcp
    capability_id: l0.trade-exec
    transport: stdio
    shell_path: "mcp_shells/l0_trade_exec/server.py"
    shell_cmd: "python3 {path}"
    envelope_version: "0.1"
    status: available
    capabilities:
      shadow_capable: true
      training_hooks: [on_order_filled, on_risk_rejected, on_signal_skipped]  # 执行样本 → ml_data/samples.jsonl，供 23/42 域进化
      oracle_verifiable: true
    tools:
      - name: place_order
        port: event
        domain: trade-exec
        read_write: write
        requires_mandate: true
        annotations: { readOnlyHint: false, destructiveHint: true }
      - name: cancel_order
        port: event
        domain: trade-exec
        read_write: write
        requires_mandate: true
        annotations: { readOnlyHint: false, destructiveHint: true }
      - name: get_positions
        port: event
        domain: trade-exec
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: get_balance
        port: event
        domain: trade-exec
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      # ── 阶段二新增：RiskCheckPort + AccountPort + PositionPort.reconcile ──
      - name: pre_trade_check
        port: event
        domain: trade-exec
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      # ── 阶段七新增：ExitCheckPort（13 域 ExitEngine，只读建议）──
      - name: check_exit
        port: event
        domain: trade-exec
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: get_account_mode
        port: event
        domain: trade-exec
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: reconcile
        port: event
        domain: trade-exec
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      # ── 阶段三新增：23/42 信号接入 ──
      - name: read_signals
        port: event
        domain: trade-exec
        read_write: read
        requires_mandate: false
        annotations: { readOnlyHint: true, destructiveHint: false }
      - name: ingest_signal
        port: event
        domain: trade-exec
        read_write: write
        requires_mandate: true
        annotations: { readOnlyHint: false, destructiveHint: true }

# ── Worker 角色→能力标签（46-DSH ADR-4 / DD2 定稿，A3 落地）────────────
# 分工：「角色→能力标签」在此登记（唯一载体）；「能力标签→工具集」由上方
# shells 段推导，不重复定义工具 schema。Router 只感知角色/标签，不感知全量
# 工具面。每角色 ≤10 工具（SPEC §3.3 B2）。
# 硬约束（ADR-9/H7）：Worker 默认只读——requires_mandate=true 的写工具
# 禁止出现在任何 Worker 角色工具集中；写操作仅由编排侧/Verifier 持 Mandate 执行。
# 首批三类起步（DD2）：研究 / 工程 / 验收；交易分析后置（避交易热路径 H5）。
worker_roles:
  research:
    description: 研究 Worker——认知检索 / 金融语义 / REA 分析（只读）
    shells: [l0.cognition.mcp, l0.semantic-39.mcp, l0.rea.mcp]
    tools: [recall, unified_search, stats, health,
            query_entity, semantic_lookup,
            submit_rea_analyze, poll_rea_analyze]
  engineer:
    description: 工程 Worker——数据读取 / REA 分析与对比（只读）
    shells: [l0.data.mcp, l0.rea.mcp, l0.cognition.mcp]
    tools: [data_fetch, data_store_read, recall,
            submit_rea_analyze, poll_rea_analyze,
            submit_rea_compare, poll_rea_compare]
  verifier:
    description: 验收 Worker——评测 / 库管只读 / 证据检索（只读）
    shells: [l0.eval.mcp, l0.store-admin.mcp, l0.cognition.mcp]
    tools: [eval_analyze, eval_report,
            store_admin_status, store_admin_query,
            recall]
  executor:
    description: 执行 Worker——交易执行观测（trade-exec 壳，只读）
    shells: [l0.trade-exec.mcp]
    tools: [get_positions, get_balance, pre_trade_check, check_exit,
            get_account_mode, reconcile, read_signals]
    # 硬约束（ADR-9/H7）：Worker 角色只读，禁止纳入 requires_mandate=true 的写工具。
    # place_order / cancel_order / ingest_signal 仅由编排侧（持 Mandate）调用。

# ── 枚举词典（校验器参照）───────────────────────────────────────
enums:
  transport: [stdio, ssh-stdio, http, in-process]
  port: [memory, collector, search, store, analysis, event]
  domain: [cognition, search, semantic, data, eval, rea, store-admin, trade-exec]
  read_write: [read, write, read-write]
  status: [available, degraded, planned, deprecated]
  envelope_version: ["0.1", "0.2"]
  # 每个 shell 的工具数硬上限（SPEC §3.3 B2：Worker 角色→工具集矩阵，每角色 ≤10 工具）
  max_tools_per_shell: 10
  # 聚合 2-3 shell 总工具数上限（SPEC R1 工具面膨胀治理）
  max_total_tools: 40
